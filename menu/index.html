/* The menu-driven model alone uses genuinely circular keypad controls. */
.controls,.keys{align-items:start}
.controls button.key,.keys button.key{
  width:100%;
  height:auto;
  aspect-ratio:1 / 1;
  min-height:0;
  padding:4px 2px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  line-height:1.1;
  font-size:clamp(12px,2.6vw,18px);
}
.controls button.key{font-size:clamp(8px,1.9vw,10px);}
.keys button.key.secondary{font-size:clamp(11px,2.4vw,15px)}
.navline button{border-radius:50%;aspect-ratio:1/1;min-height:0;}
.dotline{justify-content:flex-start;margin:0 3px 9px;}

 .keys button.key.secondary{font-size:clamp(10px,3vw,14px);}

<script>
/* URL selection only: /menu/?skin=dark or /menu/?skin=light.
   Does not share state with or redirect the scientific home page. */
const allowed=["dark","light","pink","mint","blue"];
const fromUrl=(new URLSearchParams(location.search)).get("skin");
let menuSkin=allowed.includes(fromUrl)?fromUrl:"dark";
const menuColourButtons=[...document.querySelectorAll("[data-menu-skin]")];
const neutralMenu=document.getElementById("menuNeutralSkin");
function applyMenuSkin(skin){
 if(!allowed.includes(skin))return;
 menuSkin=skin;
 document.body.classList.toggle("menu-dark",skin==="dark");
 document.body.classList.toggle("menu-light",skin!=="dark");
 document.body.classList.remove("menu-pink","menu-mint","menu-blue");
 if(["pink","mint","blue"].includes(skin))document.body.classList.add("menu-"+skin);
 menuColourButtons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.menuSkin===skin)));
 neutralMenu.setAttribute("aria-pressed",String(skin==="dark"||skin==="light"));
 neutralMenu.setAttribute("aria-label",skin==="dark"?"Menu dark, click for light":"Menu light, click for dark");
 document.getElementById("menuSkinStatus").textContent=({dark:"Dark",light:"Light",pink:"Pastel pink",mint:"Pastel green",blue:"Pastel blue"})[skin];
}
menuColourButtons.forEach(b=>b.addEventListener("click",()=>applyMenuSkin(b.dataset.menuSkin)));
neutralMenu.addEventListener("click",()=>applyMenuSkin(menuSkin==="dark"?"light":"dark"));
applyMenuSkin(menuSkin);
const menuShiftButtons=[...document.querySelectorAll("[data-menu-shift-colour]")];
function applyMenuShiftColour(colour){
 if(!["blue","green"].includes(colour))return;
 document.body.dataset.menuShiftColour=colour;
 menuShiftButtons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.menuShiftColour===colour)));
}
menuShiftButtons.forEach(b=>b.addEventListener("click",()=>applyMenuShiftColour(b.dataset.menuShiftColour)));
applyMenuShiftColour("green");
</script>
<script>
(() => {
  "use strict";
  const $=id=>document.getElementById(id);
  const display=$("display"), angleLabel=$("angle"), shiftLabel=$("shift-state"), hint=$("screen-hint");
  const state={view:"home",selection:0,menu:null,back:"calculate",angle:"deg",shift:false,
    ans:0,expr:"",answer:null,decimal:false,numberFormat:"norm",fixedDigits:3,sciDigits:5,normMode:1,
    inputOutput:"MathI/MathO",fractionResult:"improper",freqOn:false,tableMode:"both",
    decimalMark:"dot",digitSeparator:false,multiLineFont:"normal",contrast:5,
    stats:"",message:"",factorText:null,tableRows:[],box:"",ratio:null};
  const home=[["Calculate","Basic calculations"],["Statistics","Mean and spread"],["Table","Function values"],["Math Box","Dice and coin"]];
  // fx-82CW / fx-85CW / fx-350CW CATALOG order (official CW manual,
  // Advanced Calculations, pp. 43–50). This is NOT the EX catalogue.
  const catalogue=[
    ["Func Analysis","Logarithms"],
    ["Probability","%, n!, nPr, nCr, Ran#"],
    ["Numeric Calc","Absolute value and rounding"],
    ["Angle/Coord/Sexa","Units, coordinates, sexagesimal"],
    ["Hyperbolic/Trig","Hyperbolic and trig functions"],
    ["Other","Standard keys and symbols"]
  ];
  // Third value is status: false means a visible but deliberately unavailable
  // item; selecting it never inserts an unsupported or misleading expression.
  const functions={
    "Func Analysis":[
      ["Logarithm(logab)","logbase("],
      ["Logarithm(log)","log("],
      ["Natural Logarithm","ln("]
    ],
    "Probability":[
      ["%","%"],
      ["Factorial(!)","!"],
      ["Permutation(P)","nPr("],
      ["Combination(C)","nCr("],
      ["Random Number","ran#"],
      ["Random Integer","ranInt("]
    ],
    "Numeric Calc":[
      ["Absolute Value","abs("],
      ["Round Off","rnd("]
    ],
    "Angle/Coord/Sexa":[
      ["Degrees","°",false],
      ["Radians","r",false],
      ["Gradians","g",false],
      ["Rect to Polar","Pol(",false],
      ["Polar to Rect","Rec(",false],
      ["Degs Mins Secs","°′″",false]
    ],
    "Hyperbolic/Trig":[
      ["sinh","sinh("],["cosh","cosh("],["tanh","tanh("],
      ["sinh⁻¹","asinh("],["cosh⁻¹","acosh("],["tanh⁻¹","atanh("],
      ["sin","sin("],["cos","cos("],["tan","tan("],
      ["sin⁻¹","asin("],["cos⁻¹","acos("],["tan⁻¹","atan("]
    ],
    "Other":[
      ["Ans","Ans"],["π","π"],["e","e"],["√","sqrt("],
      ["x√","root(",false],["x⁻¹","^(-1)"],["x²","^2"],
      ["xʸ","^"],["Negative","−"],["Comma",","],
      ["(","("],[")",")"]
    ]
  };
  // SETUP reference: official fx-82EX/85EX/350EX manual, page 6.
  const settings=[
    ["Input/Output","Natural or linear notation"],["Angle Unit","Degrees, radians, gradians"],
    ["Number Format","Fix, Sci, Norm"],["Fraction Result","Mixed or improper"],
    ["Statistics","Frequency column"],["Table","One or two functions"],
    ["Decimal Mark","Dot or comma"],["Digit Separator","On or off"],
    ["MultiLine Font","Normal or small"],["Contrast","Light or dark"]
  ];
  const angleItems=[["Degree","D"],["Radian","R"],["Gradian","G"]];
  const numberItems=[["Fix","0 to 9 decimal places"],["Sci","0 to 9 significant digits"],["Norm","Normal format 1 or 2"]];
  const normItems=[["Norm 1","Exponents below 0.01"],["Norm 2","Exponents below 10⁻⁹"]];
  const inputItems=[["MathI/MathO","Exact output"],["MathI/DecimalO","Decimal output"],
    ["LineI/LineO","Linear input"],["LineI/DecimalO","Linear, decimal"]];
  const simpleSetupMenus={
    fractionResult:[["a b/c","Mixed"],["d/c","Improper"]],
    statisticsSetup:[["On","Frequency"],["Off","No frequency"]],
    tableSetup:[["f(x)","One function"],["f(x),g(x)","Two functions"]],
    decimalMark:[["Dot","."],["Comma",","]],
    digitSeparator:[["On","Group digits"],["Off","No grouping"]],
    multiLineFont:[["Normal Font","Large"],["Small Font","Compact"]]
  };
  const fmtItems=[["Standard / Decimal","Toggle result"],["Fraction","Exact if possible"],
    ["Decimal","Approximation"],["Scientific","Scientific display"],["Prime factors","Whole-number factorisation"]];
  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function scientific(n,places,keepTrailing=true){
    const [rawMantissa,exponent]=n.toExponential(places).split("e");
    const mantissa=keepTrailing?rawMantissa:rawMantissa.replace(/\.?0+$/,"");
    const exponentMap={"-":"⁻","+":"","0":"⁰","1":"¹","2":"²","3":"³",
      "4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
    return mantissa+"×10"+[...String(Number(exponent))].map(c=>exponentMap[c]||c).join("");
  }
  function fmt(n){
    if(!Number.isFinite(n))throw Error("Math ERROR");
    let output;
    const absolute=Math.abs(n);
    if(state.numberFormat==="fix")output=n.toFixed(state.fixedDigits);
    else if(state.numberFormat==="sci")output=scientific(n,(state.sciDigits===0?10:state.sciDigits)-1);
    else {
      const small=state.normMode===1?1e-2:1e-9;
      output=n!==0&&(absolute<small||absolute>=1e10)?
        scientific(n,9,false):String(Number(n.toPrecision(10)));
    }
    if(!output.includes("×10")){
      const parts=output.split(".");
      let integer=parts[0],fraction=parts[1];
      if(state.digitSeparator)
        integer=integer.replace(/\B(?=(\d{3})+(?!\d))/g,state.decimalMark==="comma"?".":",");
      output=integer+(fraction===undefined?"":(state.decimalMark==="comma"?",":".")+fraction);
    }else if(state.decimalMark==="comma")output=output.replace(".",",");
    return output;
  }
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
  function rational(n) {
    if(!Number.isFinite(n)||Math.abs(n)>1e7)return null;
    for(let d=1;d<=10000;d++){
      const k=Math.round(n*d);
      if(Math.abs(k/d-n)<1e-11){
        const g=gcd(k,d);
        return [k/g,d/g];
      }
    }
    return null;
  }
  function degreeFactor(){return state.angle==="deg"?Math.PI/180:state.angle==="grad"?Math.PI/200:1}
  function degreesBack(v){return v/degreeFactor()}
  function factorial(n){if(!Number.isInteger(n)||n<0||n>170)throw Error("Integer 0–170 required");let p=1;for(let i=2;i<=n;i++)p*=i;return p}
  function choose(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n)throw Error("Invalid nCr arguments");return Math.round(factorial(n)/factorial(r)/factorial(n-r))}
  function applyFunction(name,args){
    const a=args[0],b=args[1];
    switch(name){
      case "sin":return Math.sin(a*degreeFactor());
      case "cos":return Math.cos(a*degreeFactor());
      case "tan":return Math.tan(a*degreeFactor());
      case "asin":if(Math.abs(a)>1)throw Error("Math ERROR");return degreesBack(Math.asin(a));
      case "acos":if(Math.abs(a)>1)throw Error("Math ERROR");return degreesBack(Math.acos(a));
      case "atan":return degreesBack(Math.atan(a));
      case "sinh":return Math.sinh(a);
      case "cosh":return Math.cosh(a);
      case "tanh":return Math.tanh(a);
      case "asinh":return Math.asinh(a);
      case "acosh":if(a<1)throw Error("Math ERROR");return Math.acosh(a);
      case "atanh":if(Math.abs(a)>=1)throw Error("Math ERROR");return Math.atanh(a);
      case "sqrt":if(a<0)throw Error("Math ERROR");return Math.sqrt(a);
      case "cbrt":return Math.cbrt(a);
      case "abs":return Math.abs(a);
      case "ln":if(a<=0)throw Error("Math ERROR");return Math.log(a);
      case "exp":return Math.exp(a);
      case "log":if(a<=0)throw Error("Math ERROR");return Math.log10(a);
      case "logbase":{
        const base=args.length>1?a:10,number=args.length>1?b:a;
        if(base<=0||base===1||number<=0)throw Error("Math ERROR");
        return Math.log(number)/Math.log(base);
      }
      case "gcd":if(!Number.isInteger(a)||!Number.isInteger(b))throw Error("Integers required");return gcd(a,b);
      case "lcm":if(!Number.isInteger(a)||!Number.isInteger(b))throw Error("Integers required");return a===0||b===0?0:Math.abs(a*b)/gcd(a,b);
      case "nCr":return choose(a,b);
      case "nPr":return factorial(a)/factorial(a-b);
      case "rnd":return Number(a.toPrecision(10));
      case "ranInt":if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a>b||b-a>1e9)throw Error("Invalid random limits");return a+Math.floor(Math.random()*(b-a+1));
      default:throw Error("Unknown function");
    }
  }
  function evaluate(source,xValue=null) {
    let s=String(source).replace(/\s/g,"");
    if(!s)throw Error("Enter a calculation");
    s=s.replace(/\u2212/g,"-").replace(/×/g,"*").replace(/÷/g,"/");
    const tokens=[],re=/(\d+(?:\.\d*)?|\.\d+)(?:([Ee][+-]?\d+))?|([A-Za-z]+#?|π)|([()+*/^!%,\-])/y;
    for(let i=0;i<s.length;){
      re.lastIndex=i;const m=re.exec(s);
      if(!m)throw Error("Syntax ERROR");
      tokens.push(m[1]?{t:"num",v:Number(m[1]+(m[2]||""))}:m[3]?{t:"name",v:m[3]}:{t:m[4],v:m[4]});
      i=re.lastIndex;
    }
    let pos=0;
    const peek=()=>tokens[pos]?.t,consume=t=>{if(peek()!==t)throw Error("Syntax ERROR");return tokens[pos++];};
    const starts=t=>t==="num"||t==="name"||t==="(";
    function primary(){
      if(peek()==="-"){consume("-");return -parse(35)}
      if(peek()==="+"){consume("+");return parse(35)}
      if(peek()==="num")return consume("num").v;
      if(peek()==="("){consume("(");const v=parse(0);consume(")");return v}
      if(peek()==="name"){
        const name=consume("name").v;
        if(name==="π"||name==="pi")return Math.PI;
        if(name==="e")return Math.E;
        if(name==="Ans")return state.ans;
        if(name==="x"){if(xValue===null)throw Error("x is not defined");return xValue}
        if(name==="ran#")return Math.floor(Math.random()*1000)/1000;
        consume("(");
        const args=[parse(0)];
        while(peek()===","){consume(",");args.push(parse(0))}
        consume(")");
        return applyFunction(name,args);
      }
      throw Error("Syntax ERROR");
    }
    function parse(min=0){
      let a=primary();
      while(pos<tokens.length){
        if(peek()==="!"&&50>=min){consume("!");a=factorial(a);continue}
        if(peek()==="%"&&50>=min){consume("%");a/=100;continue}
        const t=peek(),imp=starts(t),prec=imp?20:({"+":10,"-":10,"*":20,"/":20,"^":40}[t]??-1);
        if(prec<min)break;
        if(!imp)pos++;
        const b=parse(t==="^"?prec:prec+1);
        if(imp||t==="*")a*=b;
        else if(t==="/")a/=b;
        else if(t==="+")a+=b;
        else if(t==="-")a-=b;
        else if(t==="^")a=Math.pow(a,b);
      }
      return a;
    }
    const out=parse(0);
    if(pos!==tokens.length||!Number.isFinite(out))throw Error("Math ERROR");
    return out;
  }
  function angle(){return state.angle==="deg"?"D":state.angle==="rad"?"R":"G"}
  function resultMarkup(value){
    const decimalOutput=["MathI/DecimalO","LineI/DecimalO"].includes(state.inputOutput);
    if(state.decimal||decimalOutput||state.numberFormat!=="norm")return escapeHtml(fmt(value));
    const fraction=rational(value);
    if(!fraction||fraction[1]===1)return escapeHtml(fmt(value));
    let numerator=fraction[0],denominator=fraction[1],whole=null;
    if(state.fractionResult==="mixed"&&Math.abs(numerator)>denominator){
      whole=Math.trunc(numerator/denominator);
      numerator=Math.abs(numerator)%denominator;
    }
    if(state.inputOutput==="LineI/LineO")
      return escapeHtml((whole===null?"":whole+" ")+numerator+"/"+denominator);
    return '<math xmlns="http://www.w3.org/1998/Math/MathML">'+
      (whole===null?'':'<mn>'+whole+'</mn>')+
      '<mfrac><mn>'+numerator+'</mn><mn>'+denominator+'</mn></mfrac></math>';
  }
  function list(items,title,paged=false){
    const start=paged?Math.floor(state.selection/4)*4:0;
    const visible=paged?items.slice(start,start+4):items;
    let markup='<div class="lcd-title catalog-title">'+escapeHtml(title)+
      (paged?' <span class="catalog-scrollbar" aria-hidden="true">▮</span>':'')+'</div><div class="menu-list">';
    visible.forEach((item,j)=>{
      const i=start+j;
      markup+='<button class="'+(state.selection===i?'selected':'')+
        '" data-choice="'+i+'" aria-label="'+escapeHtml(item[0])+'"><b>'+
        (j+1)+'</b><span class="menu-item-label">'+escapeHtml(item[0])+'</span>'+
        (title==="CATALOG"?'<span class="catalog-chevron" aria-hidden="true">▶</span>':'')+'</button>';
    });
    return markup+'</div>';
  }
  function itemsForMenu(menu){
    if(menu==="catalog")return catalogue;
    if(menu?.startsWith("functions:"))return functions[menu.slice("functions:".length)]||[];
    if(menu==="settings")return settings;
    if(menu==="angle")return angleItems;
    if(menu==="number")return numberItems;
    if(menu==="numberNorm")return normItems;
    if(menu==="inputOutput")return inputItems;
    if(menu==="format")return fmtItems;
    return simpleSetupMenus[menu]||[];
  }
  function returnFromSetup(){
    state.view=state.back;state.menu=null;state.selection=0;render();
  }
  function calcDisplay(){
    const raw=state.expr.replace(/asin\(/g,"sin⁻¹(").replace(/acos\(/g,"cos⁻¹(").replace(/atan\(/g,"tan⁻¹(").replace(/sqrt\(/g,"√(").replace(/ran#/g,"Ran#");
    // A simple numeric fraction uses a real mathematical fraction bar.
    const simple=raw.match(/^(-?\d+)\/([1-9]\d*)$/);
    const typed=simple?
      '<math xmlns="http://www.w3.org/1998/Math/MathML" aria-label="'+escapeHtml(raw)+'"><mfrac><mn>'+
      escapeHtml(simple[1])+'</mn><mn>'+escapeHtml(simple[2])+'</mn></mfrac></math>':
      escapeHtml(raw||"0");
    let out='<div class="expression">'+typed+'</div>';
    if(state.answer!==null)out+='<div class="result">'+(state.factorText?escapeHtml(state.factorText):resultMarkup(state.answer))+'</div>';
    if(state.message)out+='<div class="mini">'+escapeHtml(state.message)+'</div>';
    return out;
  }
  function render(){
    angleLabel.textContent=angle();
    shiftLabel.textContent=state.shift?"S":"";
    document.body.classList.toggle("shift-active",state.shift);
    hint.textContent=state.view==="calculate"&&state.numberFormat!=="norm"?
      (state.numberFormat==="fix"?"FIX "+state.fixedDigits:"SCI "+state.sciDigits):
      state.view==="home"?"HOME":state.view==="calculate"?"Calculate":state.view==="menu"?"MENU":state.view;
    display.style.filter="contrast("+(0.74+state.contrast*0.055)+")";
    display.classList.toggle("compact-font",
      state.multiLineFont==="small"&&state.inputOutput.startsWith("LineI"));
    if(state.view==="home"){
      display.innerHTML='<div class="home-grid">'+home.map((x,i)=>
        '<button data-choice="'+i+'" class="'+(i===state.selection?"selected":"")+'"><span class="home-symbol" aria-hidden="true">'+["×÷<span>+−</span>","▥","▦","⚄ ⚅"][i]+'</span><span class="home-text">'+escapeHtml(x[0])+'</span></button>').join("")+'</div>';
    } else if(state.view==="menu"){
      const m=state.menu;
      let items=[],title="";
      if(m==="catalog"){items=catalogue;title="CATALOG"}
      else if(m?.startsWith("functions:")){title=m.slice("functions:".length);items=functions[title]}
      else if(m==="settings"){title="SETUP";items=settings}
      else if(m==="angle"){title="Angle Unit";items=angleItems}
      else if(m==="number"){title="Number Format";items=numberItems}
      else if(m==="numberNorm"){title="Norm";items=normItems}
      else if(m==="numberFix"||m==="numberSci"){
        const name=m==="numberFix"?"Fix":"Sci";
        display.innerHTML='<div class="lcd-title">Number Format</div><div class="digit-prompt">'+
          name+' 0–9</div><p class="mini">Press 0–9 to set '+
          (m==="numberFix"?"decimal places.":"significant digits (0 = ten digits).")+'</p>';
        return;
      }
      else if(m==="contrast"){
        display.innerHTML='<div class="lcd-title">Contrast</div><div class="contrast-line"><span>Light</span><span>Dark</span></div>'+
          '<div class="contrast-line"><button data-cmd="contrast-light" aria-label="Lighter">◀</button>'+
          '<span class="contrast-meter" aria-label="Contrast level '+state.contrast+'">'+
          '▰'.repeat(state.contrast)+'▱'.repeat(10-state.contrast)+'</span>'+
          '<button data-cmd="contrast-dark" aria-label="Darker">▶</button></div>';
        return;
      }
      else if(m==="inputOutput"){title="Input/Output";items=inputItems}
      else if(simpleSetupMenus[m]){title=({
        fractionResult:"Fraction Result",statisticsSetup:"Statistics",tableSetup:"Table",
        decimalMark:"Decimal Mark",digitSeparator:"Digit Separator",
        multiLineFont:"MultiLine Font"})[m];items=simpleSetupMenus[m]}
      else if(m==="format"){title="FORMAT";items=fmtItems}
      display.innerHTML=list(items,title,m==="settings"||m==="catalog"||m==="format"||m?.startsWith("functions:"));
      if(m?.startsWith("functions:")&&state.message){
        display.insertAdjacentHTML("beforeend",'<p class="catalog-notice" role="status">'+escapeHtml(state.message)+'</p>');
      }
    } else if(state.view==="calculate")display.innerHTML=calcDisplay();
    else if(state.view==="stats"){
      display.innerHTML='<div class="lcd-title">Statistics</div><div class="mini"><p>'+
        (state.freqOn?'Enter value:frequency pairs, e.g. 2:3,4:1.':
          'Enter values separated by commas, then EXE.')+
        '</p></div><div class="expression">'+escapeHtml(state.stats||"0")+
        '</div>'+(state.message?'<div class="mini">'+escapeHtml(state.message)+'</div>':"");
    } else if(state.view==="table"){
      display.innerHTML='<div class="lcd-title">Table of values</div>'+
        '<div class="mini field"><label for="table-e">f(x)</label><input id="table-e" value="x^2" aria-label="Function of x"></div>'+
        (state.tableMode==="both"?'<div class="mini field"><label for="table-g">g(x)</label><input id="table-g" value="x+1" aria-label="Second function"></div>':"")+
        '<div class="mini field"><label for="table-start">Start</label><input id="table-start" type="number" value="0"></div>'+
        '<div class="mini field"><label for="table-end">End</label><input id="table-end" type="number" value="5"></div>'+
        '<div class="mini field"><label for="table-step">Step</label><input id="table-step" type="number" value="1" step="any"></div>'+
        '<button class="mini-action" data-special="table">Generate</button>';
    } else if(state.view==="ratio"){
      display.innerHTML='<div class="lcd-title">Ratio a : b = c : x</div><div class="mini field"><label for="ra">a</label><input type="number" id="ra" value="2"></div><div class="mini field"><label for="rb">b</label><input type="number" id="rb" value="3"></div><div class="mini field"><label for="rc">c</label><input type="number" id="rc" value="8"></div><button class="mini-action" data-special="ratio">Find x</button>'+(state.ratio!==null?'<strong class="mini">x = '+escapeHtml(fmt(state.ratio))+'</strong>':"");
    } else if(state.view==="box"){
      display.innerHTML='<div class="lcd-title">Maths Box</div><button class="mini-action" data-special="dice">Roll a die</button><button class="mini-action" data-special="coin">Flip a coin</button><p class="result">'+escapeHtml(state.box||"")+'</p>';
    }
  }
  function select(i){
    if(state.view==="home"){
      if(i<0||i>=home.length)return;
      state.view=["calculate","stats","table","box"][i];state.selection=0;state.message="";render();return;
    }
    if(state.view!=="menu")return;
    const m=state.menu;
    if(m==="catalog"){
      if(i<0||i>=catalogue.length)return;
      state.menu="functions:"+catalogue[i][0];state.selection=0;state.message="";render();return;
    }
    if(m?.startsWith("functions:")){
      const items=functions[m.slice("functions:".length)];
      if(!items?.[i])return;
      if(items[i][2]===false){
        // Do not misrepresent an unsupported calculation as working.
        state.message=items[i][0]+" — not implemented yet";
        render();return;
      }
      state.view="calculate";state.menu=null;state.selection=0;insert(items[i][1]);return;
    }
    if(m==="settings"){
      if(i<0||i>=settings.length)return;
      state.menu=["inputOutput","angle","number","fractionResult","statisticsSetup",
        "tableSetup","decimalMark","digitSeparator","multiLineFont","contrast"][i];
      state.selection=0;render();return;
    }
    if(m==="angle"){
      if(i<0||i>2)return;
      state.angle=["deg","rad","grad"][i];returnFromSetup();return;
    }
    if(m==="number"){
      if(i<0||i>2)return;
      state.menu=["numberFix","numberSci","numberNorm"][i];
      state.selection=0;render();return;
    }
    if(m==="numberNorm"){
      if(i<0||i>1)return;
      state.numberFormat="norm";state.normMode=i+1;returnFromSetup();return;
    }
    if(m==="inputOutput"){
      if(i<0||i>3)return;
      state.inputOutput=["MathI/MathO","MathI/DecimalO","LineI/LineO","LineI/DecimalO"][i];
      returnFromSetup();return;
    }
    if(simpleSetupMenus[m]){
      if(i<0||i>1)return;
      if(m==="fractionResult")state.fractionResult=i===0?"mixed":"improper";
      if(m==="statisticsSetup")state.freqOn=i===0;
      if(m==="tableSetup")state.tableMode=i===0?"single":"both";
      if(m==="decimalMark")state.decimalMark=i===0?"dot":"comma";
      if(m==="digitSeparator")state.digitSeparator=i===0;
      if(m==="multiLineFont")state.multiLineFont=i===0?"normal":"small";
      returnFromSetup();return;
    }
    if(m==="format"){
      if(i<0||i>4)return;
      state.view=state.back;state.menu=null;
      if(i===4){
        try{
          if(state.answer===null){
            let source=state.expr;
            const opened=[...source].filter(c=>c==="(").length;
            const closed=[...source].filter(c=>c===")").length;
            if(opened>closed)source+=")".repeat(opened-closed);
            state.answer=evaluate(source);state.ans=state.answer;state.expr=source;
          }
          const n=state.answer;
          if(!Number.isSafeInteger(n)||n<2)throw Error("Prime factors require a whole number ≥ 2");
          const factors=[];let value=n;
          for(let p=2;p*p<=value&&p<=1000000;p+=(p===2?1:2)){
            if(value%p===0){let k=0;do{value/=p;k++}while(value%p===0);factors.push(k>1?p+"^"+k:String(p));}
          }
          if(value>1)factors.push(String(value));
          state.factorText=String(n)+" = "+factors.join(" × ");
          state.message="";
        }catch(error){state.factorText=null;state.message=error.message;}
      }else{
        state.factorText=null;
        if(i===0)state.decimal=!state.decimal;
        else if(i===1)state.decimal=false;
        else state.decimal=true;
        if(i===3)state.message="Scientific formatting selected";
        else state.message="";
      }
      render();return;
    }
  }
  function showMenu(name){
    state.back=state.view==="menu"?state.back:state.view;
    state.menu=name;state.view="menu";state.selection=0;state.shift=false;state.message="";render();
  }
  function insert(value){
    state.view="calculate";
    if(state.answer!==null){
      if(!/^[+\-−×÷^%!]$/.test(value))state.expr="";
      else state.expr="Ans";
    }
    state.answer=null;state.message="";state.factorText=null;
    state.expr+=value;render();
  }
  function calculate(){
    try{
      let source=state.expr,opened=(source.match(/\(/g)||[]).length,closed=(source.match(/\)/g)||[]).length;
      if(opened>closed)source+=")".repeat(opened-closed);
      const value=evaluate(source);
      state.ans=value;state.answer=value;state.expr=source;state.message="";state.factorText=null;
    }catch(e){state.answer=null;state.message=e.message||"Math ERROR"}
    render();
  }
  function statsResult(){
    try{
      let pairs;
      if(state.freqOn){
        pairs=state.stats.split(",").map(part=>{
          const match=part.trim().match(/^(-?\d+(?:\.\d+)?):(\d+)$/);
          if(!match)throw Error("Enter value:frequency, e.g. 2:3,4:1");
          return [Number(match[1]),Number(match[2])];
        });
      }else{
        pairs=state.stats.split(",").map(x=>[Number(x.trim()),1]);
      }
      if(!state.stats.trim()||!pairs.length||pairs.some(([v,w])=>
        !Number.isFinite(v)||!Number.isInteger(w)||w<1))
        throw Error("Enter valid numbers and positive integer frequencies");
      const n=pairs.reduce((a,[v,w])=>a+w,0);
      if(n>1e8)throw Error("Too many observations");
      const mean=pairs.reduce((a,[v,w])=>a+v*w,0)/n;
      const sigma=Math.sqrt(pairs.reduce((a,[v,w])=>a+w*(v-mean)**2,0)/n);
      state.message="n = "+n+"   Mean = "+fmt(mean)+"   σ = "+fmt(sigma);
    }catch(e){state.message=e.message}
    render();
  }
  function back(){
    if(state.view==="menu"){
      if(state.menu?.startsWith("functions:")){state.menu="catalog";state.selection=0;state.message=""}
      else if(["numberFix","numberSci","numberNorm"].includes(state.menu)){
        state.menu="number";state.selection=0;
      }
      else if(["angle","number","inputOutput","fractionResult","statisticsSetup","tableSetup",
        "decimalMark","digitSeparator","multiLineFont","contrast"].includes(state.menu)){
        const selected=["inputOutput","angle","number","fractionResult","statisticsSetup","tableSetup",
          "decimalMark","digitSeparator","multiLineFont","contrast"].indexOf(state.menu);
        state.menu="settings";state.selection=Math.max(selected,0);
      } else {state.view=state.back;state.menu=null;state.selection=0}
      render();
    }else{state.view="home";state.selection=0;render()}
  }
  function press(cmd){
    if(cmd==="on"){state.view="home";state.selection=0;state.shift=false;render();return}
    if(cmd==="variables"){showMenu("catalog");return}
    if(cmd==="function"){showMenu("catalog");return}
    if(cmd==="tools"){showMenu("catalog");return}
    if(cmd==="page-up"){press("up");return}
    if(cmd==="page-down"){press("down");return}
    if(cmd==="exp10"){if(state.view==="calculate")insert("10^(");return}
    if(cmd==="home"){state.view="home";state.selection=0;state.shift=false;render();return}
    if(cmd==="shift"){state.shift=!state.shift;render();return}
    if(cmd==="settings"){showMenu("settings");return}
    if(cmd==="catalog"){showMenu("catalog");return}
    if(cmd==="format"){
      // FORMAT opens the result-format menu. Selecting Standard/Decimal
      // or Decimal changes the representation without losing Ans.
      showMenu("format");return;
    }
    if(state.view==="menu"&&state.menu==="contrast"&&
      ["contrast-light","contrast-dark","back","right"].includes(cmd)){
      const delta=["contrast-light","back"].includes(cmd)?-1:1;
      state.contrast=Math.max(1,Math.min(9,state.contrast+delta));render();return;
    }
    if(cmd==="back"){back();return}
    if(["up","down","right"].includes(cmd)&&["home","menu"].includes(state.view)){
      if(state.view==="menu"&&["numberFix","numberSci","contrast"].includes(state.menu))return;
      if(cmd==="right"){select(state.selection);return}
      const count=state.view==="home"?home.length:itemsForMenu(state.menu).length;
      if(!count)return;
      state.selection=(state.selection+(cmd==="up"?count-1:1))%count;render();return;
    }
    if(cmd==="exe"&&state.shift&&state.view==="calculate"){
      state.shift=false;state.decimal=true;
      if(state.answer===null)calculate();
      else{state.factorText=null;render();}
      return;
    }
    if(cmd==="ok"||cmd==="exe"){
      if(["home","menu"].includes(state.view)){select(state.selection);return}
      if(state.view==="calculate"){calculate();return}
      if(state.view==="stats"){statsResult();return}
      return;
    }
    if(cmd==="ac"){
      if(state.view==="calculate"){state.expr="";state.answer=null;state.message=""}
      else if(state.view==="stats"){state.stats="";state.message=""}
      else if(state.view==="menu"){
        if(state.menu==="contrast"){returnFromSetup();return}
        back();return}
      render();return;
    }
    if(cmd==="del"){
      if(state.view==="calculate"){state.expr=state.expr.slice(0,-1);state.answer=null;state.message=""}
      else if(state.view==="stats"){state.stats=state.stats.slice(0,-1);state.message=""}
      render();return;
    }
    if(state.view==="menu"&&["numberFix","numberSci"].includes(state.menu)&&/^[0-9]$/.test(cmd)){
      if(state.menu==="numberFix"){
        state.numberFormat="fix";state.fixedDigits=Number(cmd);
      }else{
        state.numberFormat="sci";state.sciDigits=Number(cmd);
      }
      returnFromSetup();return;
    }
    if(state.view==="menu"&&state.menu==="settings"&&/^[1-4]$/.test(cmd)){
      const start=Math.floor(state.selection/4)*4;
      select(start+Number(cmd)-1);return;
    }
    if((state.view==="home"||state.view==="menu")&&/^[1-9]$/.test(cmd)){
      const start=state.view==="menu"&&["settings","catalog","format"].includes(state.menu)?
        Math.floor(state.selection/4)*4:0;
      select(start+Number(cmd)-1);return;
    }
    if(state.view==="stats"){
      if((state.freqOn?/^[\d.,:−]$/:/^[\d.,−]$/).test(cmd))state.stats+=cmd==="−"?"-":cmd;
      render();return;
    }
    if(state.view!=="calculate")return;
    // CW alternate numeric keys: π and e are printed over 7 and 8.
    if(state.shift&&cmd==="7"){state.shift=false;insert("π");return}
    if(state.shift&&cmd==="8"){state.shift=false;insert("e");return}
    if(state.shift&&["sin","cos","tan"].includes(cmd)){state.shift=false;insert("a"+cmd+"(");return}
    if(state.shift&&cmd==="sqrt"){state.shift=false;insert("cbrt(");return}
    if(state.shift&&cmd==="square"){state.shift=false;insert("^3");return}
    if(state.shift&&cmd==="log"){state.shift=false;insert("10^(");return}
    if(state.shift&&cmd==="ln"){state.shift=false;insert("exp(");return}
    state.shift=false;
    const value=({"x":"x","sqrt":"sqrt(","square":"^2","power":"^","log":"log(","ln":"ln(","pi":"π","percent":"%","ans":"Ans","fraction":"/"})[cmd]||cmd;
    insert(value);
  }
  document.addEventListener("click",e=>{
    const target=e.target.closest("[data-cmd],[data-choice],[data-special]");
    if(!target)return;
    if(target.dataset.cmd){press(target.dataset.cmd);return}
    if(target.dataset.choice!==undefined){select(Number(target.dataset.choice));return}
    const special=target.dataset.special;
    if(special==="coin"){state.box=Math.random()<.5?"Heads":"Tails";render()}
    else if(special==="dice"){state.box=String(Math.floor(Math.random()*6)+1);render()}
    else if(special==="ratio"){
      const a=Number($("ra").value),b=Number($("rb").value),c=Number($("rc").value);
      if(!Number.isFinite(a)||a===0||![b,c].every(Number.isFinite))state.ratio=null;
      else state.ratio=b*c/a;
      render();
    }else if(special==="table"){
      try{
        const ex=$("table-e").value,second=state.tableMode==="both"?$("table-g").value:null;
        const st=Number($("table-start").value),en=Number($("table-end").value),step=Number($("table-step").value);
        if(!step||!Number.isFinite(step)||!Number.isFinite(st)||!Number.isFinite(en)||
          (en-st)/step<0||(en-st)/step>30)throw Error("Choose a valid range (at most 31 rows)");
        const rows=[];
        for(let x=st,count=0;count<31&&(step>0?x<=en+1e-10:x>=en-1e-10);x+=step,count++){
          const row=[x,evaluate(ex,x)];
          if(second!==null)row.push(evaluate(second,x));
          rows.push(row);
        }
        display.innerHTML='<div class="lcd-title">Table</div><div class="tableview"><table><thead><tr>'+
          '<th>x</th><th>f(x)</th>'+(second===null?'':'<th>g(x)</th>')+'</tr></thead><tbody>'+
          rows.map(row=>'<tr>'+row.map(value=>'<td>'+escapeHtml(fmt(value))+'</td>').join('')+
          '</tr>').join('')+'</tbody></table></div>'+
          '<button data-cmd="home" class="mini-action">HOME</button>';
      }catch(err){display.textContent=err.message}
    }
  });
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;
    const k=e.key;
    if(k==="ArrowUp"){e.preventDefault();press("up")}
    else if(k==="ArrowDown"){e.preventDefault();press("down")}
    else if(k==="ArrowLeft"){e.preventDefault();press("back")}
    else if(k==="Enter"||k==="="){e.preventDefault();press("exe")}
    else if(k==="Escape"){e.preventDefault();press("home")}
    else if(k==="Backspace"){e.preventDefault();press("del")}
    else if(/^[0-9.]$/.test(k)){e.preventDefault();press(k)}
    else if(k==="+"){e.preventDefault();press("+")}
    else if(k==="-"){e.preventDefault();press("−")}
    else if(k==="*"||k==="x"){e.preventDefault();press(k==="*"?"×":"x")}
    else if(k==="/"){e.preventDefault();press("÷")}
    else if(k==="^"||k==="("||k===")"||k===","||k===":"){e.preventDefault();press(k)}
  });
  window.addEventListener("pageshow",()=>render());
  render();
})();
</script>
<script>
/* Uniform presentation zoom for menu calculator. */
(()=>{
 "use strict";
 const stage=document.querySelector(".menu-fit-viewport");
 const shell=stage?.querySelector(".shell");
 const fitH=document.getElementById("menuFitHeight");
 const railToggle=document.getElementById("menuRailToggle");
 railToggle?.addEventListener("click",()=>{
   const collapsed=!document.body.classList.contains("menu-rail-collapsed");
   document.body.classList.toggle("menu-rail-collapsed",collapsed);
   railToggle.textContent=collapsed?"›":"‹";
   railToggle.setAttribute("aria-expanded",String(!collapsed));
   railToggle.setAttribute("aria-label",collapsed?"Show calculator controls":"Hide calculator controls");
   requestAnimationFrame(()=>{mode="height";fit();});
 });

 const fitW=document.getElementById("menuFitWidth");
 const zoom=document.getElementById("menuZoomDetail");
 const full=document.getElementById("menuFullScreen");
 const exit=document.getElementById("menuExitFullScreen");
 if(!stage||!shell||!fitH||!fitW||!zoom||!full||!exit)return;
 const naturalWidth=500,clamp=(x)=>Math.max(.4,Math.min(6,x));
 let mode="height",manualScale=1,scale=1,pending=false,drag=null;
 let priorMode="height",priorScale=1,priorX=0,priorY=0;
 function fit(){
   pending=false;
   shell.style.transform="none";
   const naturalHeight=Math.max(100,shell.offsetHeight);
   const availableWidth=Math.max(180,stage.clientWidth);
   const windowHeight=window.visualViewport?.height||window.innerHeight;
   const availableHeight=Math.max(250,windowHeight-stage.getBoundingClientRect().top-8);
   const byWidth=availableWidth/naturalWidth;
   const byHeight=Math.max(.66,Math.min(byWidth,availableHeight/naturalHeight));
   scale=clamp(mode==="height"?byHeight:mode==="width"?byWidth:
     mode==="detail"?byWidth*1.7:manualScale);
   shell.style.transform="scale("+scale+")";
   stage.style.height=Math.ceil(Math.min(naturalHeight*scale,availableHeight))+"px";
   // Scaled absolute-positioned shell contributes to scrollable extents.
   stage.classList.toggle("detail-zoom",mode==="detail"||mode==="manual"||document.body.classList.contains("menu-presentation"));
   for(const [b,k] of [[fitH,"height"],[fitW,"width"],[zoom,"detail"]])
     b.setAttribute("aria-pressed",String(mode===k));
 }
 function schedule(){if(!pending){pending=true;requestAnimationFrame(fit)}}
 function setMode(value){
   mode=value;fit();
   stage.scrollTo({left:0,top:0,behavior:"instant"});
 }
 function fullScreen(on){
   if(document.body.classList.contains("menu-presentation")===on)return;
   if(on){priorMode=mode;priorScale=manualScale;priorX=stage.scrollLeft;priorY=stage.scrollTop;}
   document.body.classList.toggle("menu-presentation",on);
   if(on)document.documentElement.requestFullscreen?.().catch(()=>{});
   else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
   full.setAttribute("aria-pressed",String(on));
   if(on)setMode("width");
   else{
     mode=priorMode;manualScale=priorScale;fit();
     stage.scrollTo({left:priorX,top:priorY,behavior:"instant"});
     full.focus({preventScroll:true});
   }
 }
 fitH.addEventListener("click",()=>setMode("height"));
 fitW.addEventListener("click",()=>setMode(mode==="width"?"height":"width"));
 zoom.addEventListener("click",()=>setMode(mode==="detail"?"height":"detail"));
 document.addEventListener("fullscreenchange",()=>{
   if(!document.fullscreenElement&&document.body.classList.contains("menu-presentation"))
     fullScreen(false);
 });
 full.addEventListener("click",()=>fullScreen(true));
 exit.addEventListener("click",()=>fullScreen(false));
 stage.addEventListener("dblclick",event=>{
   if(event.target.closest("button,a,input,select,textarea,.lcd"))return;
   event.preventDefault();setMode(mode==="detail"?"height":"detail");
 });
 // Ctrl + mouse wheel magnifies the CALCULATOR (not browser page).
 stage.addEventListener("wheel",event=>{
   if(!event.ctrlKey)return;
   event.preventDefault();
   const rect=stage.getBoundingClientRect();
   const pointX=event.clientX-rect.left+stage.scrollLeft;
   const pointY=event.clientY-rect.top+stage.scrollTop;
   const nx=pointX/scale,ny=pointY/scale;
   manualScale=clamp(scale*Math.exp(-event.deltaY*.009));
   mode="manual";fit();
   stage.scrollLeft=nx*scale-(event.clientX-rect.left);
   stage.scrollTop=ny*scale-(event.clientY-rect.top);
 },{passive:false});
 stage.addEventListener("pointerdown",event=>{
   if(!stage.classList.contains("detail-zoom")||event.button!==0||
     event.pointerType==="touch"||
     event.target.closest("button,a,input,select,textarea,[role='button']"))return;
   drag={x:event.clientX,y:event.clientY,left:stage.scrollLeft,top:stage.scrollTop};
   stage.setPointerCapture?.(event.pointerId);
   stage.classList.add("is-dragging");
 });
 stage.addEventListener("pointermove",event=>{
   if(!drag)return;
   stage.scrollLeft=drag.left-(event.clientX-drag.x);
   stage.scrollTop=drag.top-(event.clientY-drag.y);
 });
 function stopDrag(event){
   drag=null;stage.classList.remove("is-dragging");
   if(event&&stage.hasPointerCapture?.(event.pointerId))
     stage.releasePointerCapture(event.pointerId);
 }
 stage.addEventListener("pointerup",stopDrag);
 stage.addEventListener("pointercancel",stopDrag);
 document.addEventListener("keydown",event=>{
   if(event.key!=="Escape")return;
   if(document.body.classList.contains("menu-presentation")){
     event.preventDefault();event.stopImmediatePropagation();fullScreen(false);
   }else if(mode!=="height"){
     event.preventDefault();event.stopImmediatePropagation();setMode("height");
   }
 },true);
 window.addEventListener("resize",schedule,{passive:true});
 window.visualViewport?.addEventListener("resize",schedule,{passive:true});
 document.fonts?.ready.then(schedule);
 schedule();
})();
</script>
<script>
/* Dynamic LCD result typography, using maximum legible size per answer.
   Changes only font size: never changes the answer or the calculator scale. */
(()=>{
 const lcd=document.querySelector(".menu-fit-viewport .lcd");
 const display=document.getElementById("display");
 if(!lcd||!display)return;
 let queued=false;
 function fitResult(){
   queued=false;
   const answer=display.querySelector(".result");
   if(!answer)return;
   const expression=display.querySelector(".expression");
   const room=Math.max(32,display.clientHeight-(expression?.offsetHeight||0)-18);
   const width=Math.max(45,display.clientWidth-5);
   for(let px=88;px>=24;px-=2){
     answer.style.setProperty("--menu-answer-size",px+"px");
     const math=answer.querySelector("math");
     const w=Math.max(answer.scrollWidth,math?.getBoundingClientRect().width||0);
     const h=Math.max(answer.scrollHeight,math?.getBoundingClientRect().height||0);
     if(w<=width+1&&h<=room+1)break;
   }
 }
 function schedule(){if(!queued){queued=true;requestAnimationFrame(fitResult)}}
 new MutationObserver(schedule).observe(display,{subtree:true,childList:true,characterData:true});
 new ResizeObserver(schedule).observe(lcd);
 document.fonts?.ready.then(schedule);
 schedule();
})();
</script>
<script src="../result-focus.js?v=1"></script>
