<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu-based | Cal</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172230;background:#f7f9fc;color-scheme:light}
*{box-sizing:border-box}body{margin:0;padding:12px 12px 38px}
.shell{max-width:490px;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:8px;margin:0 5px 9px}
.topline a{font-size:13px;color:#436079;text-decoration:none;padding:6px;border-radius:6px}
.topline a:hover,.topline a:focus-visible{text-decoration:underline}
.topline span{font-size:12px;color:#697483}
.device{border:1px solid #dce1e8;border-radius:27px;background:#eff2f7;padding:18px 18px 19px;box-shadow:0 8px 26px #3949581b}
.dotline{display:flex;justify-content:flex-end;gap:7px;margin:0 3px 9px}
.dotline i{width:11px;height:11px;border-radius:50%}.dotline i:nth-child(1){background:#e63329}.dotline i:nth-child(2){background:#3fae49}.dotline i:nth-child(3){background:#2d7dd2}.dotline i:nth-child(4){background:#1a1a1a}
.lcd-frame{padding:8px;background:#c5ccd4;border-radius:20px;border:1px solid #b3bcc7;margin-bottom:15px}
.lcd{height:210px;border-radius:12px;background:#dbe6dc;border:1px solid #adbfb2;padding:11px 15px;color:#141e17;display:flex;flex-direction:column;overflow:hidden}
.indicators{display:flex;gap:12px;font:700 13px Georgia,serif;min-height:19px}.indicators .hint{margin-left:auto;font-size:11px}
#display{flex:1;overflow:auto;scrollbar-width:thin}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:3px 0}
.home-grid button{background:#eef4ed;border:1px solid #a9bcae;min-height:45px;border-radius:8px;color:#172a1c;font-weight:700;font-size:15px;cursor:pointer;text-align:left;padding:6px 9px}
.home-grid button.selected,.menu-list button.selected{outline:2px solid #276ba5;background:#d0e1dd}
.home-grid b{display:inline-block;min-width:21px;color:#245c8d}
.home-grid small{font-size:11px;font-weight:400;display:block;margin-left:21px}
.menu-list{display:grid;gap:4px}.menu-list button{display:flex;align-items:center;gap:9px;text-align:left;font:700 18px Georgia,serif;border:0;border-radius:5px;background:transparent;padding:4px 5px;color:inherit;cursor:pointer}
.menu-list button b{font:700 14px Arial;color:#325979;min-width:17px}
.lcd-title{font-weight:700;font-size:14px;border-bottom:1px solid #a8b9ab;padding-bottom:4px;margin:0 0 7px}
.expression{font:700 31px Georgia,'Times New Roman',serif;overflow-wrap:anywhere;min-height:46px}
.result{text-align:right;font:700 34px Georgia,'Times New Roman',serif;margin-top:11px}
.small-result{font-size:21px!important}
.result math{font-size:33px}
.mini{font-size:13px;line-height:1.4}.mini p{margin:5px 0}
kbd{font:700 12px Arial;border:1px solid #abb6ae;background:#e9efe7;padding:1px 4px;border-radius:4px}
.controls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:7px}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
button.key{font-family:Arial,Helvetica,sans-serif;min-width:0;background:linear-gradient(#fff,#f8fafc);border:1px solid #ccd3dd;border-radius:9px;color:#121b27;min-height:43px;box-shadow:0 2px 0 #cdd4df;font-size:17px;font-weight:700;cursor:pointer;padding:4px 2px}
button.key:active{box-shadow:none;transform:translateY(1px)}
button.key:focus-visible{outline:3px solid #286da6;outline-offset:2px}
.controls .key{font-size:10px;min-height:42px}
.key.accent{background:linear-gradient(#ffd18a,#ffb24a);border-color:#e8a64c}
.key.blue{color:#1e669f}
.key.shift-on{outline:2px solid #ebad38;outline-offset:1px}
.key.secondary{font-size:14px}
.navline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:9px 0 11px}
.navline button{min-height:32px;background:#e7ebf1;border:1px solid #c4ceda;border-radius:8px;color:#293a4a;font-weight:700;cursor:pointer}
.navline button:focus-visible{outline:3px solid #286da6}
.action-help{text-align:center;color:#67727d;font-size:11px;margin:10px 0 0;line-height:1.3}
fieldset{border:0;padding:0;margin:0}.field{display:grid;grid-template-columns:75px 1fr;align-items:center;gap:7px;margin:5px 0}
.field label{font-size:12px;font-weight:700}.field input{min-width:0;width:100%;font-size:15px;background:#eef5ed;border:1px solid #a9b7ac;border-radius:5px;padding:5px;color:#15211a}
.mini-action{font-weight:700;border:1px solid #94a99a;border-radius:5px;background:#edf4ed;padding:5px 10px;cursor:pointer;margin:6px 5px 4px 0}
.tableview{font-size:14px;max-height:142px;overflow:auto}.tableview table{border-collapse:collapse;width:100%}.tableview th,.tableview td{border-bottom:1px solid #afc4b0;padding:2px 8px;text-align:right}
.note{margin:12px auto 0;max-width:430px;font-size:11px;line-height:1.4;text-align:center;color:#75828d}
@media(max-width:430px){body{padding:5px 4px 26px}.device{padding:10px 9px;border-radius:17px}.lcd{height:198px;padding:9px 10px}.controls{gap:3px}.keys{gap:4px}button.key{min-height:41px;font-size:16px}.controls .key{font-size:9px}.home-grid button{font-size:13px}.expression{font-size:27px}.result{font-size:29px}}
.digit-prompt{font:700 29px Georgia,'Times New Roman',serif;margin:16px 0 8px}
.contrast-line{display:flex;justify-content:space-between;align-items:center;font:700 22px Georgia,serif;margin:11px 0;gap:8px}
.contrast-line button{background:transparent;border:0;font:700 25px Georgia,serif;cursor:pointer;color:#173420}
.contrast-meter{font:600 15px monospace;letter-spacing:1px;white-space:nowrap}
.compact-font .expression{font-size:22px!important}.compact-font .result{font-size:25px!important}
.compact-font .menu-list button{font-size:15px!important}

/* The menu-driven model alone uses genuinely circular keypad controls. */
.controls,.keys{align-items:start}
.controls button.key,.keys button.key{
  width:100%;
  height:auto;
  aspect-ratio:1 / 1;
  min-height:0;
  padding:4px 2px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  line-height:1.1;
  font-size:clamp(12px,2.6vw,18px);
}
.controls button.key{font-size:clamp(8px,1.9vw,10px);}
.keys button.key.secondary{font-size:clamp(11px,2.4vw,15px)}
.navline button{border-radius:50%;aspect-ratio:1/1;min-height:0;}
.dotline{justify-content:flex-start;margin:0 3px 9px;}
@media(max-width:430px){
 .controls button.key,.keys button.key{min-height:0;font-size:clamp(12px,3.4vw,16px);}
 .controls button.key{font-size:clamp(8px,2.3vw,10px);}
 .keys button.key.secondary{font-size:clamp(10px,3vw,14px);}
}

/* Dedicated menu-driven Dark/Light skins. Main scientific homepage is untouched. */
body.menu-dark{
  background:#e9e9e9;
  color:#e9edf3;
  color-scheme:dark;
}
body.menu-dark .topline a,
body.menu-dark .topline span{color:#47596e}
body.menu-dark .device{
  background:#55585e;
  border:2px solid #484c53;
  box-shadow:0 8px 26px #161a2030;
}
body.menu-dark .lcd-frame{
  background:#10151a;
  border-color:#0c1014;
}
body.menu-dark .lcd{
  color:#152117;
  background:#dce9dd;
  border-color:#b2c8b4;
}
body.menu-dark .controls button.key,
body.menu-dark .keys button.key{
  background:linear-gradient(#22272d,#0c1117);
  border-color:#414750;
  color:#fafcff;
  box-shadow:0 2px 0 #3e444d;
}
body.menu-dark .controls button.key.blue,
body.menu-dark .keys button.key.blue{color:#9ecaff}
body.menu-dark .controls button.key.accent,
body.menu-dark .keys button.key.accent{
  background:linear-gradient(#ffd078,#ffb738);
  border-color:#e6a742;
  color:#101419;
}
body.menu-dark .controls button.key:active,
body.menu-dark .keys button.key:active{background:#333a43;box-shadow:none}
body.menu-dark .navline button{
  background:#30363e;
  border-color:#585f68;
  color:#f6f7fa;
}
body.menu-dark .action-help{color:#dde4ec}
body.menu-dark .note{color:#536071}
/* Both skins maintain the menu-driven model's distinct round key faces. */

/* Side-by-side Maths selector, menu calculator separate from Scientific. */
.menu-layout{display:grid;grid-template-columns:165px minmax(0,490px);gap:17px;max-width:685px;margin:0 auto;align-items:start;}
.menu-layout .shell{max-width:490px;width:100%;min-width:0;}
.menu-sidebar{display:flex;flex-direction:column;gap:19px;padding:7px 3px;font-family:Arial,Helvetica,sans-serif;}
.menu-sidebar .site-logo{display:block;padding:6px 4px;background:#fff;border-radius:9px;}
.menu-sidebar .site-logo img{max-width:100%;height:auto;display:block;}
.menu-sidebar .calculator-chooser{display:flex;flex-direction:column;gap:17px;}
.menu-sidebar .model-selector{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.menu-sidebar .skin-label{color:#657485;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.menu-sidebar .model-palette{display:flex;align-items:center;gap:10px;padding:3px;}
.menu-sidebar .model-palette .skin-dot{display:block;box-sizing:border-box;appearance:none;border:2px solid #fff;width:23px;height:23px;flex:none;padding:0;border-radius:50%;box-shadow:0 0 0 1px #aebccb;cursor:pointer;text-decoration:none;}
.menu-sidebar .skin-red{background:#e63329;}
.menu-sidebar .skin-green{background:#3fae49;}
.menu-sidebar .skin-blue{background:#2d7dd2;}
.menu-sidebar .skin-neutral{background:#1a1a1a;}
.menu-sidebar .skin-dot[aria-pressed="true"]{outline:3px solid #859ab7;outline-offset:2px;}
.menu-sidebar .skin-dot:focus-visible{outline:3px solid #2d7dd2;outline-offset:3px;}
.menu-sidebar .skin-status{font-weight:600;font-size:11px;color:#657485;}
/* Pastels modify only the menu-driven CASE and button bed; LCD stays green. */
body.menu-pink .device{background:#f1dfe5;border-color:#dfc8d3;}
body.menu-mint .device{background:#dfeee3;border-color:#c5ddcb;}
body.menu-blue .device{background:#e0eafa;border-color:#c4d8f0;}
body.menu-pink .controls,body.menu-pink .keys,body.menu-pink .navline{background:#edd9e0;}
body.menu-mint .controls,body.menu-mint .keys,body.menu-mint .navline{background:#d5e7da;}
body.menu-blue .controls,body.menu-blue .keys,body.menu-blue .navline{background:#d5e2f3;}
@media(max-width:700px){
 .menu-layout{display:flex;flex-direction:column-reverse;gap:10px;width:100%;max-width:490px;}
 .menu-layout .shell{width:100%;max-width:490px;}
 .menu-sidebar{padding:4px 8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;align-items:center;}
 .menu-sidebar .site-logo{width:130px;flex:none;}
 .menu-sidebar .calculator-chooser{flex-direction:row;flex-wrap:wrap;gap:15px;}
 .menu-sidebar .model-palette{gap:8px;}
}

/* SHIFT legends: distinct blue or green, positioned immediately above round key faces. */
body[data-menu-shift-colour="blue"]{--menu-shift:#276fb9;--menu-shift-dark:#9ecaff;--menu-shift-selected:#245f9c}
body[data-menu-shift-colour="green"]{--menu-shift:#177d4f;--menu-shift-dark:#a4e8b5;--menu-shift-selected:#276d4a}
.menu-sidebar .menu-shift-picker{
 display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;
}
.menu-sidebar .menu-shift-picker .shift-title{
 display:block;width:100%;font:800 10px/1.2 Arial,Helvetica,sans-serif;
 color:#697788;text-transform:uppercase;letter-spacing:.055em;
}
.menu-sidebar .menu-shift-picker .shift-choice{
 appearance:none;width:23px;height:23px;min-width:23px;
 border:2px solid #fff;border-radius:50%;cursor:pointer;
 padding:0;box-shadow:0 0 0 1px #aebccb;
}
.menu-sidebar .shift-blue{background:#2d7dd2}
.menu-sidebar .shift-green{background:#3fae49}
.menu-sidebar .menu-shift-picker .shift-choice[aria-pressed="true"]{
 outline:3px solid #8799b0;outline-offset:2px;
}
.menu-sidebar .menu-shift-picker .shift-choice:focus-visible{
 outline:3px solid #276fb9;outline-offset:3px;
}
.keys{
 row-gap:20px;
 padding-top:14px;
}
.keys button.key[data-shift-label]{
 position:relative;
 overflow:visible;
}
.keys button.key[data-shift-label]::before{
 content:attr(data-shift-label);
 position:absolute;
 bottom:calc(100% + 2px);
 left:-4px;
 width:calc(100% + 8px);
 color:var(--menu-shift);
 text-align:center;
 font:800 clamp(10px,2.3vw,14px)/1.05 Arial,Helvetica,sans-serif;
 white-space:nowrap;
 pointer-events:none;
}
body.menu-dark .keys button.key[data-shift-label]::before{
 color:var(--menu-shift-dark);
}
body .controls button.key[data-cmd="shift"]{
 color:var(--menu-shift)!important;
 border-color:var(--menu-shift)!important;
}
body.menu-dark .controls button.key[data-cmd="shift"]{
 color:var(--menu-shift-dark)!important;
 border-color:var(--menu-shift-dark)!important;
}
body.shift-active .controls button.key[data-cmd="shift"]{
 outline:3px solid var(--menu-shift-selected)!important;
 outline-offset:1px;
}
body .keys button.key[data-shift-label]:focus-visible{
 outline:3px solid var(--menu-shift)!important;
}
@media(max-width:430px){
 .keys{row-gap:17px;padding-top:11px}
 .keys button.key[data-shift-label]::before{
  font-size:clamp(9px,3vw,12px);bottom:calc(100% + 2px);
 }
}
</style>

<script>
/* URL selection only: /menu/?skin=dark or /menu/?skin=light.
   Does not share state with or redirect the scientific home page. */
const allowed=["dark","light","pink","mint","blue"];
const fromUrl=(new URLSearchParams(location.search)).get("skin");
let menuSkin=allowed.includes(fromUrl)?fromUrl:"dark";
const menuColourButtons=[...document.querySelectorAll("[data-menu-skin]")];
const neutralMenu=document.getElementById("menuNeutralSkin");
function applyMenuSkin(skin){
 if(!allowed.includes(skin))return;
 menuSkin=skin;
 document.body.classList.toggle("menu-dark",skin==="dark");
 document.body.classList.toggle("menu-light",skin!=="dark");
 document.body.classList.remove("menu-pink","menu-mint","menu-blue");
 if(["pink","mint","blue"].includes(skin))document.body.classList.add("menu-"+skin);
 menuColourButtons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.menuSkin===skin)));
 neutralMenu.setAttribute("aria-pressed",String(skin==="dark"||skin==="light"));
 neutralMenu.setAttribute("aria-label",skin==="dark"?"Menu dark, click for light":"Menu light, click for dark");
 document.getElementById("menuSkinStatus").textContent=({dark:"Dark",light:"Light",pink:"Pastel pink",mint:"Pastel green",blue:"Pastel blue"})[skin];
}
menuColourButtons.forEach(b=>b.addEventListener("click",()=>applyMenuSkin(b.dataset.menuSkin)));
neutralMenu.addEventListener("click",()=>applyMenuSkin(menuSkin==="dark"?"light":"dark"));
applyMenuSkin(menuSkin);
const menuShiftButtons=[...document.querySelectorAll("[data-menu-shift-colour]")];
function applyMenuShiftColour(colour){
 if(!["blue","green"].includes(colour))return;
 document.body.dataset.menuShiftColour=colour;
 menuShiftButtons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.menuShiftColour===colour)));
}
menuShiftButtons.forEach(b=>b.addEventListener("click",()=>applyMenuShiftColour(b.dataset.menuShiftColour)));
applyMenuShiftColour("blue");
</script>

  function evaluate(source,xValue=null) {

      if(peek()==="("){consume("(");const v=parse(0);consume(")");return v}
      if(peek()==="name"){
        const name=consume("name").v;
        if(name==="π"||name==="pi")return Math.PI;
        if(name==="e")return Math.E;
        if(name==="Ans")return state.ans;
        if(name==="x"){if(xValue===null)throw Error("x is not defined");return xValue}
        if(name==="ran#")return Math.floor(Math.random()*1000)/1000;

        else if(t==="+")a+=b;
        else if(t==="-")a-=b;
        else if(t==="^")a=Math.pow(a,b);

      if(state.shift){showMenu("format");return}
      state.shift=false;
      if(state.factorText){state.factorText=null;state.decimal=false;}
      else state.decimal=!state.decimal;
      render();return;
    }
    if(state.view==="menu"&&state.menu==="contrast"&&
      ["contrast-light","contrast-dark","back","right"].includes(cmd)){
      const delta=["contrast-light","back"].includes(cmd)?-1:1;
      state.contrast=Math.max(1,Math.min(9,state.contrast+delta));render();return;
    }
    if(cmd==="back"){back();return}
    if(["up","down","right"].includes(cmd)&&["home","menu"].includes(state.view)){
      if(state.view==="menu"&&["numberFix","numberSci","contrast"].includes(state.menu))return;
      if(cmd==="right"){select(state.selection);return}
      const count=state.view==="home"?home.length:itemsForMenu(state.menu).length;
      if(!count)return;
      state.selection=(state.selection+(cmd==="up"?count-1:1))%count;render();return;
    }
    if(cmd==="ok"||cmd==="exe"){
      if(["home","menu"].includes(state.view)){select(state.selection);return}
      if(state.view==="calculate"){calculate();return}
      if(state.view==="stats"){statsResult();return}
      return;
    }
    if(cmd==="ac"){
      if(state.view==="calculate"){state.expr="";state.answer=null;state.message=""}
      else if(state.view==="stats"){state.stats="";state.message=""}
      else if(state.view==="menu"){
        if(state.menu==="contrast"){returnFromSetup();return}
        back();return}
      render();return;
    }
    if(cmd==="del"){
      if(state.view==="calculate"){state.expr=state.expr.slice(0,-1);state.answer=null;state.message=""}
      else if(state.view==="stats"){state.stats=state.stats.slice(0,-1);state.message=""}
      render();return;
    }
    if(state.view==="menu"&&["numberFix","numberSci"].includes(state.menu)&&/^[0-9]$/.test(cmd)){
      if(state.menu==="numberFix"){
        state.numberFormat="fix";state.fixedDigits=Number(cmd);
      }else{
        state.numberFormat="sci";state.sciDigits=Number(cmd);
      }
      returnFromSetup();return;
    }
    if(state.view==="menu"&&state.menu==="settings"&&/^[1-4]$/.test(cmd)){
      const start=Math.floor(state.selection/4)*4;
      select(start+Number(cmd)-1);return;
    }
    if((state.view==="home"||state.view==="menu")&&/^[1-9]$/.test(cmd)){
      select(Number(cmd)-1);return;
    }
    if(state.view==="stats"){
      if((state.freqOn?/^[\d.,:−]$/:/^[\d.,−]$/).test(cmd))state.stats+=cmd==="−"?"-":cmd;
      render();return;
    }
    if(state.view!=="calculate")return;
    if(state.shift&&["sin","cos","tan"].includes(cmd)){state.shift=false;insert("a"+cmd+"(");return}
    if(state.shift&&cmd==="sqrt"){state.shift=false;insert("cbrt(");return}
    if(state.shift&&cmd==="square"){state.shift=false;insert("^3");return}
    if(state.shift&&cmd==="log"){state.shift=false;insert("10^(");return}
    if(state.shift&&cmd==="ln"){state.shift=false;insert("exp(");return}
    state.shift=false;
    const value=({"x":"x","sqrt":"sqrt(","square":"^2","power":"^","log":"log(","ln":"ln(","pi":"π","percent":"%","ans":"Ans","fraction":"/"})[cmd]||cmd;
    insert(value);
  }
  document.addEventListener("click",e=>{
    const target=e.target.closest("[data-cmd],[data-choice],[data-special]");
    if(!target)return;
    if(target.dataset.cmd){press(target.dataset.cmd);return}
    if(target.dataset.choice!==undefined){select(Number(target.dataset.choice));return}
    const special=target.dataset.special;
    if(special==="coin"){state.box=Math.random()<.5?"Heads":"Tails";render()}
    else if(special==="dice"){state.box=String(Math.floor(Math.random()*6)+1);render()}
    else if(special==="ratio"){
      const a=Number($("ra").value),b=Number($("rb").value),c=Number($("rc").value);
      if(!Number.isFinite(a)||a===0||![b,c].every(Number.isFinite))state.ratio=null;
      else state.ratio=b*c/a;
      render();
    }else if(special==="table"){
      try{
        const ex=$("table-e").value,second=state.tableMode==="both"?$("table-g").value:null;
        const st=Number($("table-start").value),en=Number($("table-end").value),step=Number($("table-step").value);
        if(!step||!Number.isFinite(step)||!Number.isFinite(st)||!Number.isFinite(en)||
          (en-st)/step<0||(en-st)/step>30)throw Error("Choose a valid range (at most 31 rows)");
        const rows=[];
        for(let x=st,count=0;count<31&&(step>0?x<=en+1e-10:x>=en-1e-10);x+=step,count++){
          const row=[x,evaluate(ex,x)];
          if(second!==null)row.push(evaluate(second,x));
          rows.push(row);
        }
        display.innerHTML='<div class="lcd-title">Table</div><div class="tableview"><table><thead><tr>'+
          '<th>x</th><th>f(x)</th>'+(second===null?'':'<th>g(x)</th>')+'</tr></thead><tbody>'+
          rows.map(row=>'<tr>'+row.map(value=>'<td>'+escapeHtml(fmt(value))+'</td>').join('')+
          '</tr>').join('')+'</tbody></table></div>'+
          '<button data-cmd="home" class="mini-action">HOME</button>';
      }catch(err){display.textContent=err.message}
    }
  });
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;
    const k=e.key;
    if(k==="ArrowUp"){e.preventDefault();press("up")}
    else if(k==="ArrowDown"){e.preventDefault();press("down")}
    else if(k==="ArrowLeft"){e.preventDefault();press("back")}
    else if(k==="Enter"||k==="="){e.preventDefault();press("exe")}
    else if(k==="Escape"){e.preventDefault();press("home")}
    else if(k==="Backspace"){e.preventDefault();press("del")}
    else if(/^[0-9.]$/.test(k)){e.preventDefault();press(k)}
    else if(k==="+"){e.preventDefault();press("+")}
    else if(k==="-"){e.preventDefault();press("−")}
    else if(k==="*"||k==="x"){e.preventDefault();press(k==="*"?"×":"x")}
    else if(k==="/"){e.preventDefault();press("÷")}
    else if(k==="^"||k==="("||k===")"||k===","||k===":"){e.preventDefault();press(k)}
  });
  window.addEventListener("pageshow",()=>render());
  render();
})();
</script>
</body></html>
