/* The menu-driven model alone uses genuinely circular keypad controls. */
.controls,.keys{align-items:start}
.controls button.key,.keys button.key{
  width:100%;
  height:auto;
  aspect-ratio:1 / 1;
  min-height:0;
  padding:4px 2px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  line-height:1.1;
  font-size:clamp(12px,2.6vw,18px);
}
.controls button.key{font-size:clamp(8px,1.9vw,10px);}
.keys button.key.secondary{font-size:clamp(11px,2.4vw,15px)}
.navline button{border-radius:50%;aspect-ratio:1/1;min-height:0;}
.dotline{justify-content:flex-start;margin:0 3px 9px;}

 .keys button.key.secondary{font-size:clamp(10px,3vw,14px);}

<script>
/* URL selection only: /menu/?skin=dark or /menu/?skin=light.
   Does not share state with or redirect the scientific home page. */
const allowed=["dark","light","pink","mint","blue"];
const fromUrl=(new URLSearchParams(location.search)).get("skin");
let menuSkin=allowed.includes(fromUrl)?fromUrl:"dark";
const menuColourButtons=[...document.querySelectorAll("[data-menu-skin]")];
const neutralMenu=document.getElementById("menuNeutralSkin");
function applyMenuSkin(skin){
 if(!allowed.includes(skin))return;
 menuSkin=skin;
 document.body.classList.toggle("menu-dark",skin==="dark");
 document.body.classList.toggle("menu-light",skin!=="dark");
 document.body.classList.remove("menu-pink","menu-mint","menu-blue");
 if(["pink","mint","blue"].includes(skin))document.body.classList.add("menu-"+skin);
 menuColourButtons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.menuSkin===skin)));
 neutralMenu.setAttribute("aria-pressed",String(skin==="dark"||skin==="light"));

  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function scientific(n,places,keepTrailing=true){

  function fmt(n){

  function evaluate(source,xValue=null) {

        }
      }else if(prev.type==="frac"&&!mathIncomplete([prev])){
        top=[list.splice(--pos,1)[0]];
      }
    }
    const frac={type:"frac",id:++mathId,top,bottom:[]};
    list.splice(pos,0,frac);
    ed.cursor=pos+1;
    const slot=top.length?"bottom":"top";
    ed.path.push({node:frac,slot});
    ed.cursor=frac[slot].length;
    mathSync();
  }
  function mathAppend(v){
    mathStart(v);
    const ed=state.mathEditor,list=mathList();
    const prev=list[ed.cursor-1];
    if(/^[0-9.]$/.test(v)&&prev?.type==="text"&&
      /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(prev.value)){
      if(v==="."&&prev.value.includes("."))return;
      prev.value+=v;
    }else{
      list.splice(ed.cursor,0,{type:"text",value:v});
      ed.cursor++;
    }
    mathSync();
  }
  function mathMove(forward){
    const ed=state.mathEditor;
    if(!ed)return;
    const list=mathList();
    if(forward){
      if(ed.cursor<list.length){
        const next=list[ed.cursor];
        if(next.type==="frac"){
          ed.path.push({node:next,slot:"top"});ed.cursor=0;
        }else ed.cursor++;
      }else if(ed.path.length){
        const step=ed.path.at(-1);
        if(step.slot==="top"){step.slot="bottom";ed.cursor=step.node.bottom.length;}
        else{ed.path.pop();ed.cursor=mathList().indexOf(step.node)+1;}
      }
    }else{
      if(ed.cursor>0){
        const prev=list[ed.cursor-1];
        if(prev.type==="frac"){
          ed.path.push({node:prev,slot:"bottom"});ed.cursor=prev.bottom.length;
        }else ed.cursor--;
      }else if(ed.path.length){
        const step=ed.path.at(-1);
        if(step.slot==="bottom"){step.slot="top";ed.cursor=step.node.top.length;}
        else{ed.path.pop();ed.cursor=Math.max(0,mathList().indexOf(step.node));}
      }
    }
    mathSync();
  }
  function mathDelete(){
    const ed=state.mathEditor,list=mathList();
    if(ed.cursor>0){
      const prev=list[ed.cursor-1];
      if(prev.type==="text"&&prev.value.length>1)prev.value=prev.value.slice(0,-1);
      else{list.splice(ed.cursor-1,1);ed.cursor--;}
      mathSync();
    }else mathMove(false);
  }
  function mathPress(cmd){
    if(state.view!=="calculate")return false;
    if(cmd==="shift")return false;
    if(cmd==="on"||cmd==="home"){
      state.mathEditor=null;return false;
    }
    if(cmd==="fraction"){state.shift=false;mathFraction();return true;}
    if(!state.mathEditor)return false;
    if(["settings","catalog","function","variables","tools","format"].includes(cmd))
      return false;
    if(cmd==="ac"){
      state.mathEditor=null;state.expr="";state.answer=null;
      state.factorText=null;state.message="";render();return true;
    }
    if(cmd==="del"){mathDelete();return true;}
    if(cmd==="right"||cmd==="down"){mathMove(true);return true;}
    if(cmd==="back"||cmd==="up"){mathMove(false);return true;}
    if(cmd==="exe"||cmd==="ok"){
      if(mathIncomplete(state.mathEditor.nodes)){
        state.message="Complete the numerator and denominator";render();return true;
      }
      state.expr=mathSerial(state.mathEditor.nodes);
      state.mathEditor.calculated=true;
      calculate();
      return true;
    }
    let value=cmd;
    if(state.shift){
      const alt={"7":"π","8":"e","sin":"asin(","cos":"acos(","tan":"atan(",
        "sqrt":"cbrt(","square":"log(","power":"^(-1)",
        "log":"ln(","ln":"exp("};
      if(alt[cmd])value=alt[cmd];
      state.shift=false;
    }
    if(value===cmd){
      const mapped={"square":"^2","power":"^","sqrt":"sqrt(",
        "sin":"sin(","cos":"cos(","tan":"tan(",
        "log":"log(","ln":"ln(","ans":"Ans","exp10":"10^(",
        "fraction":null,"x":"x"};
      if(Object.prototype.hasOwnProperty.call(mapped,cmd))value=mapped[cmd];
    }
    if(typeof value!=="string")return false;
    if(!/^[0-9.+−×÷()^%,!πe]$/.test(value)&&
      !["Ans","x","^2","sqrt(","sin(","cos(","tan(",
        "asin(","acos(","atan(","cbrt(","log(","ln(","exp(","^(-1)","10^("].includes(value))
      return false;
    mathAppend(value);return true;
  }
  function mathChooseSlot(id,slot){
    if(!state.mathEditor)return false;
    function find(list,path){
      for(const node of list){
        if(node.type!=="frac")continue;
        if(node.id===id)return path.concat([{node,slot}]);
        for(const field of ["top","bottom"]){
          const p=find(node[field],path.concat([{node,slot:field}]));
          if(p)return p;
        }
      }
      return null;
    }
    const path=find(state.mathEditor.nodes,[]);
    if(!path)return false;
    state.mathEditor.path=path;
    state.mathEditor.cursor=path.at(-1).node[slot].length;
    state.mathEditor.calculated=false;
    render();return true;
  }
  function mathsInput(input,pretty){
    if(state.mathEditor)return mathMarkup();
    const draft=state.logDraft,log=draft||input.match(/^logbase\(([^,]*),([^()]*)\)$/);
    if(log){
      const b=draft?draft.base:log[1],a=draft?draft.arg:log[2];
      const slot=(v,kind)=>'<mrow class="'+(draft&&draft.slot===kind?'log-active':'')+
        '" aria-label="'+kind+'">'+(v?'<mn>'+escapeHtml(v)+'</mn>':'<mtext>□</mtext>')+'</mrow>';
      return (draft?escapeHtml(draft.prefix):'')+
        '<math xmlns="http://www.w3.org/1998/Math/MathML" aria-label="Logarithm with base '+escapeHtml(b||"blank")+
        ' and argument '+escapeHtml(a||"blank")+'"><mrow>'+
        '<msub><mi mathvariant="normal">log</mi>'+slot(b,"base")+'</msub>'+
        '<mo>(</mo>'+slot(a,"arg")+'<mo>)</mo></mrow></math>';
    }
    const frac=input.match(/^(-?\d+)\/([1-9]\d*)$/);
    if(frac)return '<math xmlns="http://www.w3.org/1998/Math/MathML"><mfrac><mn>'+
      escapeHtml(frac[1])+'</mn><mn>'+escapeHtml(frac[2])+'</mn></mfrac></math>';
    const root=input.match(/^(sqrt|cbrt)\(([^()]*)\)$/);
    if(root){
      const inside='<mtext>'+escapeHtml(root[2]||"□")+'</mtext>';
      return '<math xmlns="http://www.w3.org/1998/Math/MathML">'+
        (root[1]==="sqrt"?'<msqrt>'+inside+'</msqrt>':
         '<mroot>'+inside+'<mn>3</mn></mroot>')+'</math>';
    }
    const power=input.match(/^(-?\d+(?:\.\d+)?|\w+)\^(-?\d+(?:\.\d+)?|\w+)$/);
    if(power)return '<math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mn>'+
      escapeHtml(power[1])+'</mn><mn>'+escapeHtml(power[2])+'</mn></msup></math>';
    const common=input.match(/^(log|ln)\(([^()]*)\)$/);
    if(common)return '<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi mathvariant="normal">'+
      common[1]+'</mi><mo>(</mo><mtext>'+escapeHtml(common[2]||"□")+
      '</mtext><mo>)</mo></mrow></math>';
    return escapeHtml(pretty||"0");
  }
  function calcDisplay(){
    const raw=state.expr.replace(/asin\(/g,"sin⁻¹(").replace(/acos\(/g,"cos⁻¹(").replace(/atan\(/g,"tan⁻¹(").replace(/sqrt\(/g,"√(").replace(/ran#/g,"Ran#");
    const typed=mathsInput(state.expr,raw);
    let out='<div class="expression">'+typed+'</div>';
    if(state.answer!==null)out+='<div class="result">'+(state.factorText?escapeHtml(state.factorText):resultMarkup(state.answer))+'</div>';
    if(state.message)out+='<div class="mini">'+escapeHtml(state.message)+'</div>';
    return out;
  }

    } else if(state.view==="box"){

  function select(i){
    if(state.view==="home"){
      if(i<0||i>=home.length)return;
      state.view=["calculate","stats","table","box"][i];state.selection=0;state.message="";render();return;
    }
    if(state.view!=="menu")return;
    const m=state.menu;
    if(m==="catalog"){
      if(i<0||i>=catalogue.length)return;
      state.menu="functions:"+catalogue[i][0];state.selection=0;state.message="";render();return;
    }
    if(m?.startsWith("functions:")){
      const items=functions[m.slice("functions:".length)];
      if(!items?.[i])return;
      if(items[i][2]===false){
        // Do not misrepresent an unsupported calculation as working.
        state.message=items[i][0]+" — not implemented yet";
        render();return;
      }
      state.view="calculate";state.menu=null;state.selection=0;
      if(items[i][1]==="logbase("){startLogDraft();return;}
      insert(items[i][1]);return;
    }
    if(m==="settings"){
      if(i<0||i>=settings.length)return;
      state.menu=["inputOutput","angle","number","fractionResult","statisticsSetup",
        "tableSetup","decimalMark","digitSeparator","multiLineFont","contrast"][i];
      state.selection=0;render();return;
    }
    if(m==="angle"){
      if(i<0||i>2)return;
      state.angle=["deg","rad","grad"][i];returnFromSetup();return;
    }
    if(m==="number"){
      if(i<0||i>2)return;
      state.menu=["numberFix","numberSci","numberNorm"][i];
      state.selection=0;render();return;
    }
    if(m==="numberNorm"){
      if(i<0||i>1)return;
      state.numberFormat="norm";state.normMode=i+1;returnFromSetup();return;
    }
    if(m==="inputOutput"){
      if(i<0||i>3)return;
      state.inputOutput=["MathI/MathO","MathI/DecimalO","LineI/LineO","LineI/DecimalO"][i];
      returnFromSetup();return;
    }
    if(simpleSetupMenus[m]){
      if(i<0||i>1)return;
      if(m==="fractionResult")state.fractionResult=i===0?"mixed":"improper";
      if(m==="statisticsSetup")state.freqOn=i===0;
      if(m==="tableSetup")state.tableMode=i===0?"single":"both";
      if(m==="decimalMark")state.decimalMark=i===0?"dot":"comma";
      if(m==="digitSeparator")state.digitSeparator=i===0;
      if(m==="multiLineFont")state.multiLineFont=i===0?"normal":"small";
      returnFromSetup();return;
    }
    if(m==="format"){
      if(i<0||i>=fmtItems.length)return;
      state.view=state.back;state.menu=null;
      state.message="";state.factorText=null;
      try{
        if(state.answer===null){
          let source=state.expr;
          const opened=(source.match(/\(/g)||[]).length;
          const closed=(source.match(/\)/g)||[]).length;
          if(opened>closed)source+=")".repeat(opened-closed);
          state.answer=evaluate(source);state.ans=state.answer;state.expr=source;
        }
        const value=state.answer;
        if(i===0){state.decimal=false;}
        else if(i===1){state.decimal=true;}
        else if(i===2){
          if(!Number.isSafeInteger(value)||value<2||value>1e12)
            throw Error("Prime Factor requires an integer from 2 to 10^12");
          const factors=[];let remaining=value;
          for(let p=2;p*p<=remaining&&p<=1000000;p+=(p===2?1:2)){
            if(remaining%p!==0)continue;
            let k=0;
            do{remaining/=p;k++;}while(remaining%p===0);
            factors.push(k>1?p+"^"+k:String(p));
          }
          if(remaining>1)factors.push(String(remaining));
          state.factorText=factors.join(" × ");state.decimal=false;
        }else if(i===3||i===4){
          state.decimal=false;state.inputOutput="MathI/MathO";
          state.fractionResult=i===3?"improper":"mixed";
        }else if(i===5){
          if(value===0)state.factorText="0";
          else{
            const exp=Math.floor(Math.log10(Math.abs(value))/3)*3;
            const mantissa=Number((value/10**exp).toPrecision(10));
            state.factorText=mantissa+" × 10^"+exp;
          }
        }else if(i===6){
          // Interpret the numerical value as degrees.
          const magnitude=Math.abs(value);
          const degrees=Math.floor(magnitude);
          const minutes=Math.floor((magnitude-degrees)*60);
          const seconds=Number((((magnitude-degrees)*60-minutes)*60).toFixed(6));
          state.factorText=(value<0?"−":"")+degrees+"° "+minutes+"′ "+seconds+"″";
        }
      }catch(error){
        state.factorText=null;state.message=error.message||"Math ERROR";
      }
      render();return;
    }
  }
  function showMenu(name){
    state.back=state.view==="menu"?state.back:state.view;
    state.menu=name;state.view="menu";state.selection=0;state.shift=false;state.message="";render();
  }
  function insert(value){
    state.mathEditor=null;
    state.view="calculate";
    if(state.answer!==null){
      if(!/^[+\-−×÷^%!]$/.test(value))state.expr="";
      else state.expr="Ans";
    }
    state.answer=null;state.message="";state.factorText=null;
    state.expr+=value;render();
  }
  function calculate(){
    try{
      let source=state.expr,opened=(source.match(/\(/g)||[]).length,closed=(source.match(/\)/g)||[]).length;
      if(opened>closed)source+=")".repeat(opened-closed);
      const value=evaluate(source);
      state.ans=value;state.answer=value;state.expr=source;state.message="";state.factorText=null;
    }catch(e){state.answer=null;state.message=e.message||"Math ERROR"}
    render();
  }
  function statsResult(){
    try{
      let pairs;
      if(state.freqOn){
        pairs=state.stats.split(",").map(part=>{
          const match=part.trim().match(/^(-?\d+(?:\.\d+)?):(\d+)$/);
          if(!match)throw Error("Enter value:frequency, e.g. 2:3,4:1");
          return [Number(match[1]),Number(match[2])];
        });
      }else{
        pairs=state.stats.split(",").map(x=>[Number(x.trim()),1]);
      }
      if(!state.stats.trim()||!pairs.length||pairs.some(([v,w])=>
        !Number.isFinite(v)||!Number.isInteger(w)||w<1))
        throw Error("Enter valid numbers and positive integer frequencies");
      const n=pairs.reduce((a,[v,w])=>a+w,0);
      if(n>1e8)throw Error("Too many observations");
      const mean=pairs.reduce((a,[v,w])=>a+v*w,0)/n;
      const sigma=Math.sqrt(pairs.reduce((a,[v,w])=>a+w*(v-mean)**2,0)/n);
      state.message="n = "+n+"   Mean = "+fmt(mean)+"   σ = "+fmt(sigma);
    }catch(e){state.message=e.message}
    render();
  }
  function back(){
    if(state.view==="menu"){
      if(state.menu?.startsWith("functions:")){state.menu="catalog";state.selection=0;state.message=""}
      else if(["numberFix","numberSci","numberNorm"].includes(state.menu)){
        state.menu="number";state.selection=0;
      }
      else if(["angle","number","inputOutput","fractionResult","statisticsSetup","tableSetup",
        "decimalMark","digitSeparator","multiLineFont","contrast"].includes(state.menu)){
        const selected=["inputOutput","angle","number","fractionResult","statisticsSetup","tableSetup",
          "decimalMark","digitSeparator","multiLineFont","contrast"].indexOf(state.menu);
        state.menu="settings";state.selection=Math.max(selected,0);
      } else {state.view=state.back;state.menu=null;state.selection=0}
      render();
    }else{state.view="home";state.selection=0;render()}
  }
  function press(cmd){
    if((cmd==="fraction"||state.mathEditor)&&mathPress(cmd))return;
    if(state.logDraft){
      if(editLogDraft(cmd))return;
      if(!["shift","home","settings","catalog","format"].includes(cmd))return;
    }
    if(cmd==="on"){state.view="home";state.selection=0;state.shift=false;render();return}
    if(cmd==="variables"){showMenu("catalog");return}
    if(cmd==="function"){showMenu("catalog");return}
    if(cmd==="tools"){showMenu("catalog");return}
    if(cmd==="page-up"){press("up");return}
    if(cmd==="page-down"){press("down");return}
    if(cmd==="exp10"){if(state.view==="calculate")insert("10^(");return}
    if(cmd==="home"){state.view="home";state.selection=0;state.shift=false;render();return}
    if(cmd==="shift"){state.shift=!state.shift;render();return}
    if(cmd==="settings"){showMenu("settings");return}
    if(cmd==="catalog"){showMenu("catalog");return}
    if(cmd==="format"){
      // FORMAT opens the result-format menu. Selecting Standard/Decimal
      // or Decimal changes the representation without losing Ans.
      showMenu("format");return;
    }
    if(state.view==="menu"&&state.menu==="contrast"&&
      ["contrast-light","contrast-dark","back","right"].includes(cmd)){
      const delta=["contrast-light","back"].includes(cmd)?-1:1;
      state.contrast=Math.max(1,Math.min(9,state.contrast+delta));render();return;
    }
    if(cmd==="back"){back();return}
    if(["up","down","right"].includes(cmd)&&["home","menu"].includes(state.view)){
      if(state.view==="menu"&&["numberFix","numberSci","contrast"].includes(state.menu))return;
      if(cmd==="right"){select(state.selection);return}
      const count=state.view==="home"?home.length:itemsForMenu(state.menu).length;
      if(!count)return;
      state.selection=(state.selection+(cmd==="up"?count-1:1))%count;render();return;
    }
    if(cmd==="exe"&&state.shift&&state.view==="calculate"){
      state.shift=false;state.decimal=true;
      if(state.answer===null)calculate();
      else{state.factorText=null;render();}
      return;
    }
    if(cmd==="ok"||cmd==="exe"){
      if(["home","menu"].includes(state.view)){select(state.selection);return}
      if(state.view==="calculate"){calculate();return}
      if(state.view==="stats"){statsResult();return}
      return;
    }
    if(cmd==="ac"){
      if(state.view==="calculate"){state.expr="";state.answer=null;state.message=""}
      else if(state.view==="stats"){state.stats="";state.message=""}
      else if(state.view==="menu"){
        if(state.menu==="contrast"){returnFromSetup();return}
        back();return}
      render();return;
    }
    if(cmd==="del"){
      if(state.view==="calculate"){state.expr=state.expr.slice(0,-1);state.answer=null;state.message=""}
      else if(state.view==="stats"){state.stats=state.stats.slice(0,-1);state.message=""}
      render();return;
    }
    if(state.view==="menu"&&["numberFix","numberSci"].includes(state.menu)&&/^[0-9]$/.test(cmd)){
      if(state.menu==="numberFix"){
        state.numberFormat="fix";state.fixedDigits=Number(cmd);
      }else{
        state.numberFormat="sci";state.sciDigits=Number(cmd);
      }
      returnFromSetup();return;
    }
    if(state.view==="menu"&&state.menu==="settings"&&/^[1-4]$/.test(cmd)){
      const start=Math.floor(state.selection/4)*4;
      select(start+Number(cmd)-1);return;
    }
    if((state.view==="home"||state.view==="menu")&&/^[1-9]$/.test(cmd)){
      const start=state.view==="menu"&&["settings","catalog","format"].includes(state.menu)?
        Math.floor(state.selection/4)*4:0;
      select(start+Number(cmd)-1);return;
    }
    if(state.view==="stats"){
      if((state.freqOn?/^[\d.,:−]$/:/^[\d.,−]$/).test(cmd))state.stats+=cmd==="−"?"-":cmd;
      render();return;
    }
    if(state.view!=="calculate")return;
    if(cmd==="log"&&!state.shift){startLogDraft();return;}
    // CW alternate numeric keys: π and e are printed over 7 and 8.
    if(state.shift&&cmd==="7"){state.shift=false;insert("π");return}
    if(state.shift&&cmd==="8"){state.shift=false;insert("e");return}
    if(state.shift&&["sin","cos","tan"].includes(cmd)){state.shift=false;insert("a"+cmd+"(");return}
    if(state.shift&&cmd==="sqrt"){state.shift=false;insert("cbrt(");return}
    if(state.shift&&cmd==="square"){state.shift=false;insert("log(");return}
    if(state.shift&&cmd==="power"){state.shift=false;insert("^(-1)");return}
    if(state.shift&&cmd==="log"){state.shift=false;insert("ln(");return}
    if(state.shift&&cmd==="ln"){state.shift=false;insert("exp(");return}
    state.shift=false;
    const value=({"x":"x","sqrt":"sqrt(","square":"^2","power":"^","sin":"sin(","cos":"cos(","tan":"tan(","log":"log(","ln":"ln(","pi":"π","percent":"%","ans":"Ans"})[cmd]||cmd;
    insert(value);
  }
  document.addEventListener("click",e=>{
    const slot=e.target?.closest?.("[data-math-id][data-math-slot]");
    if(slot&&mathChooseSlot(Number(slot.dataset.mathId),slot.dataset.mathSlot))return;
    const target=e.target.closest("[data-cmd],[data-choice],[data-special]");
    if(!target)return;
    if(target.dataset.cmd){press(target.dataset.cmd);return}
    if(target.dataset.choice!==undefined){select(Number(target.dataset.choice));return}
    const special=target.dataset.special;
    if(special==="coin"){state.box=Math.random()<.5?"Heads":"Tails";render()}
    else if(special==="dice"){state.box=String(Math.floor(Math.random()*6)+1);render()}
    else if(special==="ratio"){
      const a=Number($("ra").value),b=Number($("rb").value),c=Number($("rc").value);
      if(!Number.isFinite(a)||a===0||![b,c].every(Number.isFinite))state.ratio=null;
      else state.ratio=b*c/a;
      render();
    }else if(special==="table"){
      try{
        const ex=$("table-e").value,second=state.tableMode==="both"?$("table-g").value:null;
        const st=Number($("table-start").value),en=Number($("table-end").value),step=Number($("table-step").value);
        if(!step||!Number.isFinite(step)||!Number.isFinite(st)||!Number.isFinite(en)||
          (en-st)/step<0||(en-st)/step>30)throw Error("Choose a valid range (at most 31 rows)");
        const rows=[];
        for(let x=st,count=0;count<31&&(step>0?x<=en+1e-10:x>=en-1e-10);x+=step,count++){
          const row=[x,evaluate(ex,x)];
          if(second!==null)row.push(evaluate(second,x));
          rows.push(row);
        }
        display.innerHTML='<div class="lcd-title">Table</div><div class="tableview"><table><thead><tr>'+
          '<th>x</th><th>f(x)</th>'+(second===null?'':'<th>g(x)</th>')+'</tr></thead><tbody>'+
          rows.map(row=>'<tr>'+row.map(value=>'<td>'+escapeHtml(fmt(value))+'</td>').join('')+
          '</tr>').join('')+'</tbody></table></div>'+
          '<button data-cmd="home" class="mini-action">HOME</button>';
      }catch(err){display.textContent=err.message}
    }
  });
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;
    const k=e.key;
    if(k==="ArrowUp"){e.preventDefault();press("up")}
    else if(k==="ArrowDown"){e.preventDefault();press("down")}
    else if(k==="ArrowLeft"){e.preventDefault();press("back")}
    else if(k==="Enter"||k==="="){e.preventDefault();press("exe")}
    else if(k==="Escape"){e.preventDefault();press("home")}
    else if(k==="Backspace"){e.preventDefault();press("del")}
    else if(/^[0-9.]$/.test(k)){e.preventDefault();press(k)}
    else if(k==="+"){e.preventDefault();press("+")}
    else if(k==="-"){e.preventDefault();press("−")}
    else if(k==="*"||k==="x"){e.preventDefault();press(k==="*"?"×":"x")}
    else if(k==="/"){e.preventDefault();press("÷")}
    else if(k==="^"||k==="("||k===")"||k===","||k===":"){e.preventDefault();press(k)}
  });
  Object.defineProperty(window,"menuFractionState",{
    configurable:true,
    get(){
      const ed=state.mathEditor;
      return ed?{active:true,calculated:ed.calculated,
        incomplete:mathIncomplete(ed.nodes),
        slot:ed.path.at(-1)?.slot||"outside"}:null;
    }
  });
  window.addEventListener("pageshow",()=>render());
  render();
})();
</script>
<script>
/* Uniform presentation zoom for menu calculator. */
(()=>{
 "use strict";
 const stage=document.querySelector(".menu-fit-viewport");
 const shell=stage?.querySelector(".shell");
 const fitH=document.getElementById("menuFitHeight");
 const railToggle=document.getElementById("menuRailToggle");
 railToggle?.addEventListener("click",()=>{
   const collapsed=!document.body.classList.contains("menu-rail-collapsed");
   document.body.classList.toggle("menu-rail-collapsed",collapsed);
   railToggle.textContent=collapsed?"›":"‹";
   railToggle.setAttribute("aria-expanded",String(!collapsed));
   railToggle.setAttribute("aria-label",collapsed?"Show calculator controls":"Hide calculator controls");
   requestAnimationFrame(()=>{mode="width";fit();});
 });

 const fitW=document.getElementById("menuFitWidth");
 const zoom=document.getElementById("menuZoomDetail");
 const full=document.getElementById("menuFullScreen");
 const exit=document.getElementById("menuExitFullScreen");
 if(!stage||!shell||!fitH||!fitW||!zoom||!full||!exit)return;
 const naturalWidth=500,clamp=(x)=>Math.max(.4,Math.min(6,x));
 let mode="width",manualScale=1,scale=1,pending=false,drag=null;
 let priorMode="width",priorScale=1,priorX=0,priorY=0;
 function fit(){
   pending=false;
   shell.style.transform="none";
   const naturalHeight=Math.max(100,shell.offsetHeight);
   const availableWidth=Math.max(180,stage.clientWidth);
   const windowHeight=window.visualViewport?.height||window.innerHeight;
   const availableHeight=Math.max(250,windowHeight-stage.getBoundingClientRect().top-8);
   const byWidth=availableWidth/naturalWidth;
   const byHeight=Math.max(new URLSearchParams(location.search).has("compare")?.32:.66,Math.min(byWidth,availableHeight/naturalHeight));
   scale=clamp(mode==="height"?byHeight:mode==="width"?byWidth:
     mode==="detail"?byWidth*1.7:manualScale);
   shell.style.transform="scale("+scale+")";
   stage.style.height=Math.ceil(Math.min(naturalHeight*scale,availableHeight))+"px";
   // Scaled absolute-positioned shell contributes to scrollable extents.
   stage.classList.toggle("detail-zoom",mode==="detail"||mode==="manual"||document.body.classList.contains("menu-presentation"));
   for(const [b,k] of [[fitH,"height"],[fitW,"width"],[zoom,"detail"]])
     b.setAttribute("aria-pressed",String(mode===k));
 }
 function schedule(){if(!pending){pending=true;requestAnimationFrame(fit)}}
 function setMode(value){
   mode=value;fit();
   stage.scrollTo({left:0,top:0,behavior:"instant"});
 }
 function fullScreen(on){
   if(document.body.classList.contains("menu-presentation")===on)return;
   if(on){priorMode=mode;priorScale=manualScale;priorX=stage.scrollLeft;priorY=stage.scrollTop;}
   document.body.classList.toggle("menu-presentation",on);
   if(on)document.documentElement.requestFullscreen?.().catch(()=>{});
   else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
   full.setAttribute("aria-pressed",String(on));
   if(on)setMode("width");
   else{
     mode=priorMode;manualScale=priorScale;fit();
     stage.scrollTo({left:priorX,top:priorY,behavior:"instant"});
     full.focus({preventScroll:true});
   }
 }
 fitH.addEventListener("click",()=>setMode("height"));
 fitW.addEventListener("click",()=>setMode(mode==="width"?"height":"width"));
 zoom.addEventListener("click",()=>setMode(mode==="detail"?"height":"detail"));
 document.addEventListener("fullscreenchange",()=>{
   if(!document.fullscreenElement&&document.body.classList.contains("menu-presentation"))
     fullScreen(false);
 });
 full.addEventListener("click",()=>fullScreen(true));
 exit.addEventListener("click",()=>fullScreen(false));
 // Double/triple tap on blank case is now reserved for EXE and SHIFT+EXE.
 // Ctrl + mouse wheel magnifies the CALCULATOR (not browser page).
 stage.addEventListener("wheel",event=>{
   if(!event.ctrlKey)return;
   event.preventDefault();
   const rect=stage.getBoundingClientRect();
   const pointX=event.clientX-rect.left+stage.scrollLeft;
   const pointY=event.clientY-rect.top+stage.scrollTop;
   const nx=pointX/scale,ny=pointY/scale;
   manualScale=clamp(scale*Math.exp(-event.deltaY*.009));
   mode="manual";fit();
   stage.scrollLeft=nx*scale-(event.clientX-rect.left);
   stage.scrollTop=ny*scale-(event.clientY-rect.top);
 },{passive:false});
 stage.addEventListener("pointerdown",event=>{
   if(!stage.classList.contains("detail-zoom")||event.button!==0||
     event.pointerType==="touch"||
     event.target.closest("button,a,input,select,textarea,[role='button']"))return;
   drag={x:event.clientX,y:event.clientY,left:stage.scrollLeft,top:stage.scrollTop};
   stage.setPointerCapture?.(event.pointerId);
   stage.classList.add("is-dragging");
 });
 stage.addEventListener("pointermove",event=>{
   if(!drag)return;
   stage.scrollLeft=drag.left-(event.clientX-drag.x);
   stage.scrollTop=drag.top-(event.clientY-drag.y);
 });
 function stopDrag(event){
   drag=null;stage.classList.remove("is-dragging");
   if(event&&stage.hasPointerCapture?.(event.pointerId))
     stage.releasePointerCapture(event.pointerId);
 }
 stage.addEventListener("pointerup",stopDrag);
 stage.addEventListener("pointercancel",stopDrag);
 document.addEventListener("keydown",event=>{
   if(event.key!=="Escape")return;
   if(document.body.classList.contains("menu-presentation")){
     event.preventDefault();event.stopImmediatePropagation();fullScreen(false);
   }else if(mode!=="height"){
     event.preventDefault();event.stopImmediatePropagation();setMode("height");
   }
 },true);
 window.addEventListener("resize",schedule,{passive:true});
 window.visualViewport?.addEventListener("resize",schedule,{passive:true});
 document.fonts?.ready.then(schedule);
 schedule();
})();
</script>
<script>
/* Dynamic LCD result typography, using maximum legible size per answer.
   Changes only font size: never changes the answer or the calculator scale. */
(()=>{
 const lcd=document.querySelector(".menu-fit-viewport .lcd");
 const display=document.getElementById("display");
 if(!lcd||!display)return;
 let queued=false;
 function fitResult(){
   queued=false;
   const answer=display.querySelector(".result");
   if(!answer)return;
   const expression=display.querySelector(".expression");
   const room=Math.max(32,display.clientHeight-(expression?.offsetHeight||0)-18);
   const width=Math.max(45,display.clientWidth-5);
   for(let px=88;px>=24;px-=2){
     answer.style.setProperty("--menu-answer-size",px+"px");
     const math=answer.querySelector("math");
     const w=Math.max(answer.scrollWidth,math?.getBoundingClientRect().width||0);
     const h=Math.max(answer.scrollHeight,math?.getBoundingClientRect().height||0);
     if(w<=width+1&&h<=room+1)break;
   }
 }
 function schedule(){if(!queued){queued=true;requestAnimationFrame(fitResult)}}
 new MutationObserver(schedule).observe(display,{subtree:true,childList:true,characterData:true});
 new ResizeObserver(schedule).observe(lcd);
 document.fonts?.ready.then(schedule);
 schedule();
})();
</script>

<script>
/* Brief colour-matched key feedback; existing maths logic unchanged. */
(()=>{
"use strict";
const viewport=document.querySelector(".menu-fit-viewport");
const shift=viewport?.querySelector('[data-cmd="shift"]');
if(!viewport)return;
const timers=new WeakMap();
function flash(button){
 if(!button)return;
 const old=timers.get(button);if(old!==undefined)clearTimeout(old);
 button.classList.remove("menu-key-flash");
 void button.offsetWidth;
 button.classList.add("menu-key-flash");
 timers.set(button,setTimeout(()=>{button.classList.remove("menu-key-flash");timers.delete(button)},240));
}
function closest(target){
 if(!(target instanceof Element))return null;
 const b=target.closest(".cw-upper-keys button,.cw-number-keys button,.cw-functions button,.cw-control-deck button");
 return b&&viewport.contains(b)?b:null;
}
viewport.addEventListener("pointerdown",e=>{
 if(e.isPrimary&&e.button===0)flash(closest(e.target));
},{capture:true,passive:true});
viewport.addEventListener("click",e=>flash(closest(e.target)),true);
const mapped={"*":"×","/":"÷","-":"−","Enter":"exe","=":"exe","Backspace":"del"};
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.altKey||e.metaKey||["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;
 const key=mapped[e.key]||e.key;
 const b=[...viewport.querySelectorAll(".cw-upper-keys [data-cmd],.cw-number-keys [data-cmd]")].find(x=>x.dataset.cmd===key);
 if(b)flash(b);
},true);
if(shift){
 const sync=()=>shift.setAttribute("aria-pressed",String(document.body.classList.contains("shift-active")));
 new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:["class"]});
 sync();
}
})();
</script>
